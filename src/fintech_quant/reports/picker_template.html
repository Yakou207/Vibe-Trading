<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__PICKER_TITLE__</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0e0f13;
  --surface-1: #17181d;
  --surface-2: #1f2027;
  --surface-hover: #252630;
  --border: #2c2d36;
  --grid: #23242c;
  --shadow: none;
  --text-primary: #f0efec;
  --text-secondary: #c3c2b7;
  --text-muted: #8a897f;
  --accent: #e87ba4;
  --accent-soft: rgba(232, 123, 164, 0.16);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s7: #9085e9;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --up: #e66767; --down: #199e70;
  --up-bg: rgba(230, 103, 103, 0.13);
  --down-bg: rgba(25, 158, 112, 0.13);
  --good-bg: rgba(12, 163, 12, 0.10);
  --warn-bg: rgba(250, 178, 25, 0.11);
  --serious-bg: rgba(236, 131, 90, 0.11);
  --crit-bg: rgba(208, 59, 59, 0.12);
  --info-bg: rgba(57, 135, 229, 0.12);
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #eceae4;
    --surface-1: #fcfcfb;
    --surface-2: #f3f2ee;
    --surface-hover: #eae8e1;
    --border: #d9d7cf;
    --grid: #e8e6df;
    --shadow: 0 1px 2px rgba(15, 15, 15, .04), 0 0 0 1px var(--border);
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #7a7972;
    --accent-soft: rgba(232, 123, 164, 0.18);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s7: #6250d6;
    --up: #d03b3b; --down: #008300;
    --up-bg: rgba(208, 59, 59, 0.09);
    --down-bg: rgba(0, 131, 0, 0.09);
    --good-bg: rgba(12, 163, 12, 0.08);
    --warn-bg: rgba(201, 133, 0, 0.10);
    --serious-bg: rgba(235, 104, 52, 0.09);
    --crit-bg: rgba(208, 59, 59, 0.09);
    --info-bg: rgba(42, 120, 214, 0.09);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #eceae4;
  --surface-1: #fcfcfb;
  --surface-2: #f3f2ee;
  --surface-hover: #eae8e1;
  --border: #d9d7cf;
  --grid: #e8e6df;
  --shadow: 0 1px 2px rgba(15, 15, 15, .04), 0 0 0 1px var(--border);
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #7a7972;
  --accent-soft: rgba(232, 123, 164, 0.18);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s7: #6250d6;
  --up: #d03b3b; --down: #008300;
  --up-bg: rgba(208, 59, 59, 0.09);
  --down-bg: rgba(0, 131, 0, 0.09);
  --good-bg: rgba(12, 163, 12, 0.08);
  --warn-bg: rgba(201, 133, 0, 0.10);
  --serious-bg: rgba(235, 104, 52, 0.09);
  --crit-bg: rgba(208, 59, 59, 0.09);
  --info-bg: rgba(42, 120, 214, 0.09);
}
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text-primary);
  font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1440px; margin: 0 auto; padding: 14px 18px 36px; }
.panel {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--shadow);
}
h2 {
  font: 600 11px/1 var(--mono);
  letter-spacing: .08em;
  text-transform: uppercase;
  margin: 0;
  color: var(--text-secondary);
}
.muted { color: var(--text-muted); }
.mono, .num, table, .kpi .v, .px, .big, .bar-row { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }

/* Topbar */
.topbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 18px;
  align-items: center;
  padding: 12px 18px;
  margin-bottom: 14px;
}
.brand { font: 800 18px/1 var(--mono); letter-spacing: .02em; }
.brand span { color: var(--accent); }
.nav { display: flex; gap: 6px; }
.nav a {
  font: 600 11.5px var(--mono);
  color: var(--text-secondary);
  text-decoration: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 11px;
  transition: border-color .15s, color .15s, background .15s;
}
.nav a:hover { color: var(--text-primary); border-color: var(--text-muted); }
.nav a[aria-current="page"] { color: var(--text-primary); border-color: var(--accent); background: var(--accent-soft); }
.top-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.meta { font: 11px/1.45 var(--mono); color: var(--text-muted); text-align: right; }
.theme-btn {
  font: 600 11px/1 var(--mono);
  padding: 6px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-secondary);
  cursor: pointer;
  transition: border-color .15s, color .15s;
}
.theme-btn:hover { color: var(--text-primary); border-color: var(--accent); }

/* Collapsible Pre-Market Pulse & Pitfall Panel */
.pm-panel {
  padding: 13px 18px;
  margin-bottom: 14px;
}
.pm-head {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.pm-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font: 600 10.5px/1 var(--mono);
  padding: 4px 9px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-secondary);
  white-space: nowrap;
}
.pm-pill.risk_on { border-color: rgba(12, 163, 12, .42); background: var(--good-bg); color: var(--text-primary); }
.pm-pill.risk_on::before { content: "●"; color: var(--good); font-size: 9px; }
.pm-pill.neutral { border-color: rgba(250, 178, 25, .42); background: var(--warn-bg); color: var(--text-primary); }
.pm-pill.neutral::before { content: "◐"; color: var(--warning); font-size: 9px; }
.pm-pill.risk_off { border-color: rgba(208, 59, 59, .45); background: var(--crit-bg); color: var(--text-primary); }
.pm-pill.risk_off::before { content: "▲"; color: var(--critical); font-size: 9px; }
.pm-pill.unknown::before { content: "○"; color: var(--text-muted); font-size: 9px; }
.pm-note { font: 11px var(--mono); color: var(--text-muted); }
.pm-toggle {
  margin-left: auto;
  font: 600 11px/1 var(--mono);
  padding: 5px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-secondary);
  cursor: pointer;
}
.pm-toggle:hover { color: var(--text-primary); border-color: var(--accent); }
.pm-body { margin-top: 12px; }
.pm-body[hidden] { display: none; }
.pm-unavail {
  display: flex;
  align-items: center;
  gap: 8px;
  font: 11.5px var(--mono);
  color: var(--text-muted);
}

.idx-grid {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 10px;
}
.idx-card {
  background: var(--surface-2);
  border-radius: 8px;
  padding: 9px 11px 8px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.idx-head { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; }
.idx-name { font-weight: 600; font-size: 12px; color: var(--text-primary); }
.idx-code { font: 10px var(--mono); color: var(--text-muted); }
.idx-row { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.idx-close { font: 700 14.5px/1.1 var(--mono); color: var(--text-primary); }
.idx-chg {
  font: 600 10.5px/1 var(--mono);
  padding: 2px 6px;
  border-radius: 999px;
}
.idx-chg.up { background: var(--up-bg); color: var(--up); }
.idx-chg.down { background: var(--down-bg); color: var(--down); }
.idx-spark { width: 100%; height: 26px; display: block; }
.ma-dots { display: flex; gap: 7px; align-items: center; font: 10px var(--mono); color: var(--text-muted); }
.ma-dot { display: inline-flex; align-items: center; gap: 3px; }
.ma-dot i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--text-muted); }
.ma-dot.above { color: var(--text-secondary); }
.ma-dot.above i { background: var(--good); border-color: var(--good); }

.pm-strip {
  background: var(--surface-2);
  border-radius: 8px;
  padding: 9px 12px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 18px;
  margin-bottom: 10px;
}
.breadth-box { flex: 1 1 210px; min-width: 180px; }
.breadth-top { display: flex; justify-content: space-between; font: 10.5px var(--mono); margin-bottom: 4px; }
.breadth-track { display: flex; height: 6px; border-radius: 999px; overflow: hidden; background: var(--border); gap: 1px; }
.breadth-track .u { background: var(--up); }
.breadth-track .f { background: var(--text-muted); opacity: .45; }
.breadth-track .d { background: var(--down); }
.breadth-stats { display: flex; flex-wrap: wrap; gap: 6px 12px; font: 11px var(--mono); color: var(--text-secondary); }
.breadth-stats b { color: var(--text-primary); font-weight: 700; }
.ma-meters { display: flex; gap: 10px; align-items: center; margin-left: auto; flex-wrap: wrap; }
.ma-m { display: flex; align-items: center; gap: 5px; font: 10.5px var(--mono); color: var(--text-secondary); }
.ma-m .tr { width: 38px; height: 5px; border-radius: 999px; background: var(--border); overflow: hidden; }
.ma-m .tr i { display: block; height: 100%; background: var(--s1); border-radius: 999px; }

.ov-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 8px;
  align-items: center;
  margin-bottom: 10px;
}
.ov-label { font: 600 10.5px var(--mono); color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; margin-right: 2px; }
.ov-cap {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 9px;
  border-radius: 999px;
  background: var(--surface-2);
  font: 11px var(--mono);
}
.ov-cap .n { color: var(--text-secondary); }
.ov-cap .v { color: var(--text-primary); font-weight: 600; }

.radar-bar {
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.radar-bar.pass { background: var(--good-bg); border: 1px solid rgba(12, 163, 12, .28); color: var(--text-primary); }
.radar-bar.pass::before { content: "●"; color: var(--good); font-size: 10px; }
.radar-bar.unchecked { background: var(--surface-2); color: var(--text-muted); font: 11.5px var(--mono); }
.radar-bar.unchecked::before { content: "☐"; }
.radar-alerts { display: flex; flex-wrap: wrap; gap: 8px; }
.radar-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  border-left: 3px solid var(--warning);
  background: var(--warn-bg);
  color: var(--text-primary);
  font: 11.5px/1.35 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  cursor: pointer;
  text-align: left;
  transition: transform .12s, border-color .12s;
}
.radar-chip:hover { transform: translateY(-1px); border-color: var(--accent); }
.radar-chip.high { border-left-color: var(--critical); background: var(--crit-bg); }
.radar-chip.info { border-left-color: var(--s1); background: var(--info-bg); }
.radar-chip .rk {
  font: 600 10px var(--mono);
  padding: 2px 6px;
  border-radius: 999px;
  background: var(--surface-1);
  border: 1px solid var(--border);
}
.radar-chip .rs { font: 700 11.5px var(--mono); }
.radar-chip .rd { font: 10.5px var(--mono); color: var(--text-muted); }

/* Search Bar */
.search {
  display: flex;
  gap: 10px;
  padding: 13px 18px;
  margin-bottom: 14px;
  align-items: center;
  flex-wrap: wrap;
}
.search input {
  flex: 1;
  min-width: 220px;
  font: 14px var(--mono);
  padding: 10px 13px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-primary);
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.search input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.search button {
  font: 600 13px var(--mono);
  padding: 10px 18px;
  border-radius: 8px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: #0b0b0b;
  cursor: pointer;
  transition: filter .15s, transform .1s;
}
.search button:hover { filter: brightness(1.06); }
.search button:active { transform: translateY(1px); }

/* Main Layout */
.grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 14px; }
.section { padding: 16px 18px; margin-bottom: 14px; }
.section-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.section-head .right { margin-left: auto; font: 11px var(--mono); color: var(--text-muted); }

/* Stock Header & Semantic Verdict */
.stock-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.stock-head .name { font: 800 23px/1.15 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; letter-spacing: -.01em; }
.stock-head .px { font: 700 20px/1 var(--mono); }

.verdict {
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 12px;
  border: 1px solid var(--border);
  border-left: 3.5px solid var(--border);
  background: var(--surface-2);
}
.verdict.entry { border-left-color: var(--good); background: var(--good-bg); }
.verdict.watch { border-left-color: var(--warning); background: var(--warn-bg); }
.verdict.wait { border-left-color: var(--serious); background: var(--serious-bg); }
.verdict.avoid { border-left-color: var(--critical); background: var(--crit-bg); }
.verdict .head { font: 700 14.5px/1.35 var(--mono); }
.verdict.entry .head::before { content: "● "; color: var(--good); }
.verdict.watch .head::before { content: "◐ "; color: var(--warning); }
.verdict.wait .head::before { content: "▲ "; color: var(--serious); }
.verdict.avoid .head::before { content: "✕ "; color: var(--critical); }
.verdict ul { margin: 7px 0 0; padding-left: 18px; color: var(--text-secondary); font-size: 12.5px; line-height: 1.55; }

/* Inline Stock Pre-Market Context Box */
.stock-pm-box {
  border-radius: 8px;
  padding: 10px 13px;
  margin-bottom: 12px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.stock-pm-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}
.stock-pm-title { font: 600 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
.stock-pm-metrics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  font: 11.5px var(--mono);
  color: var(--text-secondary);
}
.stock-pm-metrics b { color: var(--text-primary); }
.stock-pm-alert {
  padding: 6px 9px;
  border-radius: 6px;
  border-left: 3px solid var(--warning);
  background: var(--warn-bg);
  font-size: 12px;
  color: var(--text-primary);
}
.stock-pm-alert.high { border-left-color: var(--critical); background: var(--crit-bg); }
.stock-pm-alert.info { border-left-color: var(--s1); background: var(--info-bg); }

/* Charts */
#chart { height: 360px; position: relative; }
.chart-tabs { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.chart-tabs button {
  font: 600 11px var(--mono);
  color: var(--text-secondary);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 12px;
  cursor: pointer;
}
.chart-tabs button[aria-pressed="true"] { color: var(--text-primary); border-color: var(--accent); background: var(--accent-soft); }
.chart-tabs .right { margin-left: auto; font: 11px var(--mono); color: var(--text-muted); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font: 11px var(--mono); color: var(--text-secondary); margin-top: 8px; }
.legend span::before { content: ""; display: inline-block; width: 14px; height: 2px; margin-right: 5px; vertical-align: middle; background: var(--c); }

/* Luk Checks & Bars */
.checks { display: grid; gap: 7px; }
.check { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; padding: 8px 10px; border-radius: 7px; background: var(--surface-2); }
.check .icon { font: 700 13px var(--mono); }
.check.ok .icon { color: var(--good); } .check.no .icon { color: var(--critical); }
.check .label { font-weight: 600; }
.check .detail { color: var(--text-secondary); font: 11.5px/1.5 var(--mono); }
.bars { display: grid; gap: 7px; }
.bar-row { display: grid; grid-template-columns: 96px 1fr 60px; gap: 8px; align-items: center; font: 11.5px var(--mono); }
.bar-row .track { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar-row .track i { display: block; height: 100%; border-radius: 999px; }

/* Refined Tables & Inline Pills */
table { width: 100%; border-collapse: collapse; font: 11.5px var(--mono); }
th {
  text-align: left;
  font: 600 10.5px var(--mono);
  color: var(--text-muted);
  padding: 6px 6px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
td {
  padding: 7px 6px;
  border-bottom: 1px solid var(--grid);
  color: var(--text-secondary);
  vertical-align: middle;
}
td.num, th.num { text-align: right; }
tr.click { cursor: pointer; transition: background .12s; }
tr.click:hover td { background: var(--surface-hover); }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font: 600 10px/1.1 var(--mono);
  padding: 3px 8px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  white-space: nowrap;
}
.badge.trigger { border-color: rgba(12, 163, 12, .45); background: var(--good-bg); color: var(--text-primary); }
.badge.trigger::before { content: "●"; color: var(--good); font-size: 8px; }
.badge.setup { border-color: rgba(250, 178, 25, .45); background: var(--warn-bg); color: var(--text-primary); }
.badge.setup::before { content: "◐"; color: var(--warning); font-size: 8px; }

.inline-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.itag {
  display: inline-flex;
  align-items: center;
  font: 600 9.5px/1.1 var(--mono);
  padding: 2px 6px;
  border-radius: 999px;
  white-space: nowrap;
}
.itag.pit-high { background: var(--crit-bg); color: var(--up); border: 1px solid rgba(208, 59, 59, .35); }
.itag.pit-medium { background: var(--warn-bg); color: var(--warning); border: 1px solid rgba(250, 178, 25, .35); }
.itag.pit-info { background: var(--info-bg); color: var(--s1); border: 1px solid rgba(57, 135, 229, .35); }
.itag.auc-ok { background: var(--good-bg); color: var(--text-primary); border: 1px solid rgba(12, 163, 12, .32); }
.itag.auc-warn { background: var(--warn-bg); color: var(--text-primary); border: 1px solid rgba(250, 178, 25, .38); }
.itag.auc-bad { background: var(--crit-bg); color: var(--up); border: 1px solid rgba(208, 59, 59, .42); }

/* Refined Pool KPI Tiles (micro-label on top, bold figure below) */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.kpi {
  background: var(--surface-2);
  border-radius: 8px;
  padding: 9px 11px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.kpi .l { font: 500 10.5px/1.2 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; color: var(--text-muted); order: -1; }
.kpi .v { font: 700 16.5px/1.2 var(--mono); color: var(--text-primary); }

.note { font-size: 11.5px; color: var(--text-muted); margin-top: 8px; line-height: 1.5; }
.empty { padding: 24px; text-align: center; color: var(--text-muted); }
.up { color: var(--up); } .down { color: var(--down); }
.pass { color: var(--good); } .fail { color: var(--critical); }

/* Research & Jev */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip {
  font: 11px var(--mono);
  border: 1px solid var(--border);
  background: var(--surface-2);
  border-radius: 6px;
  padding: 3px 8px;
  color: var(--text-secondary);
}
.chip.ok::before { content: "● "; color: var(--good); }
.chip.empty::before { content: "○ "; color: var(--text-muted); }
.chip.failed::before, .chip.timeout::before { content: "✕ "; color: var(--critical); }
.chip.pos::before { content: "▲ "; color: var(--up); }
.chip.neg::before { content: "▼ "; color: var(--down); }
.hero-row { display: flex; gap: 22px; align-items: baseline; flex-wrap: wrap; margin-bottom: 10px; }
.hero-row .big { font: 800 24px var(--mono); }
.items { max-height: 320px; overflow: auto; }
.item { padding: 7px 0; border-bottom: 1px dashed var(--grid); font-size: 12px; }
.item .meta { font: 10.5px var(--mono); color: var(--text-muted); text-align: left; }
.item a { color: var(--text-primary); text-decoration: none; }
.item a:hover { text-decoration: underline; }
.item .pol-pos { color: var(--up); } .item .pol-neg { color: var(--down); }
.flags { margin: 8px 0 0; padding-left: 0; list-style: none; font-size: 12px; }
.flags li::before { margin-right: 6px; }
.flags li.p1::before { content: "▲"; color: var(--up); }
.flags li.n1::before { content: "▼"; color: var(--down); }
.flags li.z0::before { content: "●"; color: var(--text-muted); }
.jev-btn {
  font: 600 12.5px var(--mono);
  padding: 8px 15px;
  border-radius: 7px;
  border: 1px solid var(--accent);
  background: transparent;
  color: var(--text-primary);
  cursor: pointer;
}
.jev-btn:hover:not([disabled]) { background: var(--accent-soft); }
.jev-btn[disabled] { opacity: .5; cursor: not-allowed; }
.judgment { font: 700 15px var(--mono); margin: 8px 0; }
.judgment.support::before { content: "● "; color: var(--good); }
.judgment.neutral::before { content: "◐ "; color: var(--warning); }
.judgment.veto::before { content: "✕ "; color: var(--critical); }
.cost {
  margin-top: 10px;
  padding: 8px 11px;
  border-radius: 7px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  font: 11.5px/1.7 var(--mono);
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
}
.cost b { color: var(--text-primary); font-weight: 700; }
.cost .k { color: var(--text-muted); margin-right: 4px; }
.sub-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }

@media (max-width: 1120px) { .idx-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 1000px) {
  .sub-grid, .grid { grid-template-columns: minmax(0, 1fr); }
  .top-right { margin-left: 0; }
  .meta { text-align: left; }
}
@media (max-width: 560px) {
  .wrap { padding: 10px 12px 28px; }
  .idx-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #chart { height: 280px; }
  .bar-row { grid-template-columns: 74px 1fr 50px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="panel topbar">
    <div class="brand">VIBE<span>·</span>DESK</div>
    <nav class="nav"><a href="/">交易桌</a><a href="/picks" aria-current="page">选股</a></nav>
    <div class="top-right">
      <div class="meta" id="meta">载入中…</div>
      <button type="button" class="theme-btn" id="theme-toggle" title="切换深色/浅色主题">☀ 浅色</button>
    </div>
  </header>

  <section class="panel pm-panel" id="premarket-panel" aria-label="盘前脉搏与排雷" hidden></section>

  <form class="panel search" id="search-form" autocomplete="off">
    <input id="query" list="universe" placeholder="搜索任意 A 股代码或名称，例如 601398、工商银行、300624" aria-label="股票代码或名称">
    <datalist id="universe"></datalist>
    <button type="submit">分析</button>
    <span class="muted mono" style="font-size:11px">Martin Luk 四步：强势股 → 整理平台 → 平台内强度 → 支撑共振急跌收复</span>
  </form>

  <div class="grid">
    <main>
      <section class="panel section" id="stock"><div class="empty">搜索一只股票，或点击右侧候选。</div></section>
      <section class="panel section" id="jev-panel" hidden></section>
      <section class="panel section" id="research" hidden></section>
    </main>
    <aside>
      <section class="panel section">
        <div class="section-head"><h2>自动化交易池 · TOP 5</h2><span class="right" id="pool-meta"></span></div>
        <div id="pool"></div>
      </section>
      <section class="panel section">
        <div class="section-head"><h2>影子池 v2 · 观察名单 + 风险仓位</h2><span class="right" id="pool-v2-meta"></span></div>
        <div id="pool-v2"></div>
      </section>
      <section class="panel section">
        <div class="section-head"><h2>盘中触发监控 · v2 观察名单</h2><span class="right" id="intraday-monitor-meta"></span></div>
        <div id="intraday-monitor"></div>
      </section>
      <section class="panel section">
        <div class="section-head"><h2>候选 · 触发与观察</h2><span class="right" id="cand-meta"></span></div>
        <div id="candidates"></div>
      </section>
    </aside>
  </div>
</div>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pct = (v, d = 1) => (v == null ? "—" : `${(v * 100).toFixed(d)}%`);
  const signedPct = (v, d = 2) => {
    if (v == null || Number.isNaN(Number(v))) return "—";
    const n = Number(v) * 100;
    return `${n > 0 ? "+" : ""}${n.toFixed(d)}%`;
  };
  const num = (v, d = 2) => (v == null ? "—" : Number(v).toFixed(d));
  const fmtTurnover = (bn) => {
    if (bn == null || Number.isNaN(Number(bn))) return "—";
    const n = Number(bn);
    return n >= 1000 ? `${(n / 1000).toFixed(2)}万亿` : `${Math.round(n * 10).toLocaleString()}亿`;
  };

  const STATE = { trigger: "触发", setup: "观察", leader_weak_base: "强势·弱平台", leader_no_base: "强势·无平台", avoid: "回避" };
  const SUPPORT = { ema9: "9 EMA", ema21: "21 EMA", ema50: "50 EMA", avwap_swing_low: "AVWAP·低点", avwap_swing_high: "AVWAP·高点", prior_pivot: "前高", gap: "缺口" };
  const REGIME = { risk_on: "偏多 Risk-On", neutral: "中性震荡 Neutral", risk_off: "防御收缩 Risk-Off", unknown: "市场状态未接入" };
  const PIT_SHORT = { ex_dividend: "除权", unlock: "解禁", earnings: "财报", overnight_negative: "隔夜风险", suspension: "停牌" };
  const PIT_LONG = { ex_dividend: "除权除息", unlock: "限售解禁", earnings: "财报窗口", overnight_negative: "隔夜利空", suspension: "停牌提示" };
  const AUC_FLAG = {
    at_limit_up_cannot_buy: "涨停买不到",
    near_limit_up: "接近涨停",
    large_gap_up: "大幅高开",
    at_limit_down: "跌停",
    large_gap_down: "大幅低开",
    no_auction_quote: "无竞价",
    auction_volume_surge: "放量",
    auction_thin_liquidity: "偏薄",
    weak_vs_index: "弱于指数",
    strong_vs_index: "强于指数",
    below_luk_stop: "破止损",
    stop_too_wide: "止损拉大",
  };

  let chart = null, intraday = null, current = null, view = "daily", intradayTimer = null;
  let premarketCtx = null, latestPicks = null;

  /* Theme toggle with persistence */
  const rootEl = document.documentElement;
  const themeBtn = $("theme-toggle");
  function currentTheme() {
    const explicit = rootEl.getAttribute("data-theme");
    if (explicit === "light" || explicit === "dark") return explicit;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  }
  function syncThemeLabel() {
    themeBtn.textContent = currentTheme() === "dark" ? "☀ 浅色" : "☾ 深色";
  }
  try {
    const saved = localStorage.getItem("vibe_theme");
    if (saved === "light" || saved === "dark") rootEl.setAttribute("data-theme", saved);
  } catch (_) {}
  syncThemeLabel();
  themeBtn.addEventListener("click", () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    rootEl.setAttribute("data-theme", next);
    try { localStorage.setItem("vibe_theme", next); } catch (_) {}
    syncThemeLabel();
    if (current) setView(view);
  });

  async function getJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error(`${r.status}`); return r.json(); }

  function badge(state) { return `<span class="badge ${state}">${esc(STATE[state] || state)}</span>`; }

  /* Pre-Market Context Helpers & Collapsible Panel */
  function symbolPitfalls(symbol) {
    const alerts = premarketCtx && premarketCtx.pitfall_calendar && Array.isArray(premarketCtx.pitfall_calendar.alerts)
      ? premarketCtx.pitfall_calendar.alerts : [];
    return alerts.filter((a) => a.symbol === symbol);
  }

  function symbolAuction(symbol) {
    return (premarketCtx && premarketCtx.auction && premarketCtx.auction.by_symbol)
      ? premarketCtx.auction.by_symbol[symbol] || null : null;
  }

  function inlinePmBadges(symbol) {
    const tags = [];
    for (const a of symbolPitfalls(symbol)) {
      const sev = a.severity === "high" ? "pit-high" : a.severity === "info" ? "pit-info" : "pit-medium";
      const label = PIT_SHORT[a.kind] || a.kind || "提示";
      tags.push(`<span class="itag ${sev}" title="${esc(`${a.title || ""}${a.detail ? " · " + a.detail : ""}`)}">${esc(label)}</span>`);
    }
    const auc = symbolAuction(symbol);
    if (auc && auc.auction_price != null) {
      const flags = Array.isArray(auc.flags) ? auc.flags : [];
      const isBad = flags.some((f) => ["at_limit_up_cannot_buy", "at_limit_down", "large_gap_down", "below_luk_stop", "stop_too_wide"].includes(f));
      const isWarn = flags.some((f) => ["near_limit_up", "large_gap_up", "weak_vs_index", "auction_thin_liquidity"].includes(f));
      const cls = isBad ? "auc-bad" : isWarn ? "auc-warn" : "auc-ok";
      const leadFlag = flags.length ? ` · ${AUC_FLAG[flags[0]] || flags[0]}` : "";
      const tip = [
        `竞价 ${num(auc.auction_price, 2)} (${signedPct(auc.gap_pct, 2)})`,
        auc.relative_gap_pct != null ? `相对指数 ${signedPct(auc.relative_gap_pct, 2)}` : "",
        `竞价额/20日均额 ${auc.auction_volume_ratio != null ? `${(Number(auc.auction_volume_ratio) * 100).toFixed(1)}%` : "—"}`,
      ].filter(Boolean).join(" · ");
      tags.push(`<span class="itag ${cls}" title="${esc(tip)}">竞价 ${signedPct(auc.gap_pct, 1)}${esc(leadFlag)}</span>`);
    }
    return tags.length ? `<div class="inline-tags">${tags.join("")}</div>` : "";
  }

  function sparkSvg(points, isUp, uid) {
    if (!Array.isArray(points) || points.length < 2) return '<svg class="idx-spark" viewBox="0 0 120 26"></svg>';
    const vals = points.map(Number);
    const min = Math.min(...vals), max = Math.max(...vals), span = max - min || 1;
    const w = 120, h = 26, pad = 3;
    const pts = vals.map((v, i) => [
      Number(((i / (vals.length - 1)) * (w - 4) + 2).toFixed(1)),
      Number((h - pad - ((v - min) / span) * (h - pad * 2)).toFixed(1)),
    ]);
    const line = pts.map(([x, y]) => `${x},${y}`).join(" ");
    const area = `${pts[0][0]},${h} ${line} ${pts[pts.length - 1][0]},${h}`;
    const stroke = isUp ? "var(--up)" : "var(--down)";
    const last = pts[pts.length - 1];
    return `<svg class="idx-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${stroke}" stop-opacity="0.26"/><stop offset="100%" stop-color="${stroke}" stop-opacity="0"/></linearGradient></defs>
      <polygon points="${area}" fill="url(#${uid})"/>
      <polyline points="${line}" fill="none" stroke="${stroke}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="2" fill="${stroke}"/>
    </svg>`;
  }

  function maDot(label, val) {
    const cls = val === true ? "above" : "";
    return `<span class="ma-dot ${cls}" title="MA${label}${val === true ? " 上方" : val === false ? " 下方" : ""}"><i></i>${label}</span>`;
  }

  function renderPremarketPanel(ctx) {
    const el = $("premarket-panel");
    if (!ctx) { el.hidden = true; return; }
    el.hidden = false;
    const mp = ctx.market_pulse || { status: "unavailable" };
    const pc = ctx.pitfall_calendar || { status: "not_checked", alerts: [] };
    const alerts = Array.isArray(pc.alerts) ? pc.alerts : [];
    const hasPulse = mp.status && mp.status !== "unavailable";

    if (ctx.status === "unavailable" && !hasPulse && pc.status === "not_checked") {
      el.innerHTML = `<div class="pm-unavail"><span>○</span><span>盘前数据未就绪：指数、宽度和排雷日历由盘后任务在审计通过后生成，外盘与竞价在交易日早上打开本页时抓取</span></div>`;
      return;
    }

    let collapsed = false;
    try { collapsed = localStorage.getItem("vibe_pm_collapsed") === "1"; } catch (_) {}

    const regime = mp.regime || "unknown";
    const indices = Array.isArray(mp.indices) ? mp.indices : [];
    const cardsHtml = indices.map((idx, i) => {
      const chg = Number(idx.change_pct || 0);
      const isUp = chg >= 0;
      return `<div class="idx-card">
        <div class="idx-head"><span class="idx-name">${esc(idx.name)}</span><span class="idx-code">${esc(idx.symbol)}</span></div>
        <div class="idx-row"><span class="idx-close">${Number(idx.close).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span><span class="idx-chg ${isUp ? "up" : "down"}">${signedPct(chg, 2)}</span></div>
        ${sparkSvg(idx.sparkline, isUp, `pmsp-${i}`)}
        <div class="ma-dots"><span>MA</span>${maDot("20", idx.above_ma20)}${maDot("50", idx.above_ma50)}${maDot("250", idx.above_ma250)}</div>
      </div>`;
    }).join("");

    let breadthHtml = "";
    const b = mp.breadth;
    if (b) {
      const adv = Number(b.advancers || 0), flat = Number(b.unchanged || 0), dec = Number(b.decliners || 0);
      const tot = adv + flat + dec || 1;
      const vs5 = b.turnover_vs_5d_pct;
      const meter = (lbl, v) => v == null ? "" : `<div class="ma-m"><span>${lbl}</span><span class="tr"><i style="width:${Math.max(0, Math.min(100, Number(v) * 100)).toFixed(0)}%"></i></span><b>${(Number(v) * 100).toFixed(0)}%</b></div>`;
      breadthHtml = `<div class="pm-strip">
        <div class="breadth-box">
          <div class="breadth-top"><span class="up">涨 ${adv.toLocaleString()}</span><span class="muted">平 ${flat}</span><span class="down">跌 ${dec.toLocaleString()}</span></div>
          <div class="breadth-track"><span class="u" style="width:${(adv / tot * 100).toFixed(1)}%"></span><span class="f" style="width:${(flat / tot * 100).toFixed(1)}%"></span><span class="d" style="width:${(dec / tot * 100).toFixed(1)}%"></span></div>
        </div>
        <div class="breadth-stats">
          <span>涨停 <b class="up">${b.limit_up_count ?? "—"}</b></span>
          <span>跌停 <b class="down">${b.limit_down_count ?? "—"}</b></span>
          <span>成交 <b>${fmtTurnover(b.turnover_cny_bn)}</b>${vs5 != null ? ` <span class="${Number(vs5) >= 0 ? "up" : "down"}">(${signedPct(vs5, 1)} vs 5D)</span>` : ""}</span>
        </div>
        <div class="ma-meters" title="沪深300成分股站上均线比例">
          <span class="muted mono" style="font-size:10px">CSI300</span>
          ${meter("MA20", b.csi300_above_ma20_pct)}${meter("MA50", b.csi300_above_ma50_pct)}${meter("MA250", b.csi300_above_ma250_pct)}
        </div>
      </div>`;
    }

    const overseasList = Array.isArray(mp.overseas) ? mp.overseas : [];
    const sectorAlerts = Array.isArray(mp.sector_alerts) ? mp.sector_alerts : [];
    const ovHtml = (overseasList.length || sectorAlerts.length) ? `<div class="ov-strip">
      ${overseasList.length ? `<span class="ov-label">隔夜外盘</span>${overseasList.map((o) => {
        const chg = Number(o.change_pct || 0);
        const decs = Number(o.value) < 20 ? 3 : 1;
        return `<span class="ov-cap"><span class="n">${esc(o.name)}</span><span class="v">${Number(o.value).toLocaleString("en-US", { minimumFractionDigits: decs, maximumFractionDigits: decs })}</span><span class="${chg >= 0 ? "up" : "down"}">${signedPct(chg, 2)}</span></span>`;
      }).join("")}` : ""}
      ${sectorAlerts.map((s) => {
        const chg = Number(s.change_pct || 0);
        return `<span class="ov-cap" title="${esc(s.note || "")}"><span class="n">${esc(s.industry)}·${esc(s.peer)}</span><span class="${chg >= 0 ? "up" : "down"}">${signedPct(chg, 1)}</span></span>`;
      }).join("")}
    </div>` : "";

    let radarHtml = "";
    if (pc.status === "not_checked") {
      radarHtml = '<div class="radar-bar unchecked">盘前排雷日历未校验（除权除息 / 限售解禁 / 财报窗口 / 隔夜利空 / 停牌）</div>';
    } else if (!alerts.length) {
      radarHtml = '<div class="radar-bar pass">盘前排雷全通过 — 标的池无除权、解禁、财报冲突或隔夜重大利空</div>';
    } else {
      radarHtml = `<div class="radar-alerts">${alerts.map((a) => `
        <button type="button" class="radar-chip ${esc(a.severity || "medium")}" data-symbol="${esc(a.symbol)}" title="${esc(a.detail || "")}">
          <span class="rk">${esc(PIT_LONG[a.kind] || a.kind || "提示")}</span>
          <span class="rs">${esc(a.symbol)}</span>
          <span>${esc(a.name || "")} · ${esc(a.title || "")}</span>
          <span class="rd">${esc(a.date || "")}</span>
        </button>`).join("")}</div>`;
    }

    el.innerHTML = `<div class="pm-head">
      <h2>盘前脉搏与排雷 · PRE-MARKET</h2>
      <span class="pm-pill ${esc(regime)}">${esc(REGIME[regime] || regime)}</span>
      ${ctx.signal_date ? `<span class="pm-pill">信号日 ${esc(ctx.signal_date)}</span>` : ""}
      ${alerts.length ? `<span class="pm-pill" style="border-color:rgba(250,178,25,.45)">▲ ${alerts.length} 条排雷提示</span>` : (pc.status === "ok" ? '<span class="pm-pill risk_on">排雷全通过</span>' : "")}
      <span class="pm-note">${esc(mp.regime_note || "")}</span>
      ${liveNote(ctx)}
      ${ctx.live ? `<button type="button" class="pm-toggle" id="pm-refresh-btn" title="重新抓取外盘与隔夜公告">${ctx.live.refreshing ? "抓取中…" : "刷新"}</button>` : ""}
      <button type="button" class="pm-toggle" id="pm-toggle-btn">${collapsed ? "展开 ▾" : "收起 ▴"}</button>
    </div>
    <div class="pm-body" id="pm-body"${collapsed ? " hidden" : ""}>
      ${cardsHtml ? `<div class="idx-grid">${cardsHtml}</div>` : ""}
      ${breadthHtml}
      ${ovHtml}
      ${radarHtml}
    </div>`;

    $("pm-toggle-btn").addEventListener("click", () => {
      const body = $("pm-body");
      body.hidden = !body.hidden;
      $("pm-toggle-btn").textContent = body.hidden ? "展开 ▾" : "收起 ▴";
      try { localStorage.setItem("vibe_pm_collapsed", body.hidden ? "1" : "0"); } catch (_) {}
    });
    el.querySelectorAll(".radar-chip[data-symbol]").forEach((btn) => {
      btn.addEventListener("click", () => load(btn.dataset.symbol));
    });
    const refreshBtn = $("pm-refresh-btn");
    if (refreshBtn) refreshBtn.addEventListener("click", () => loadPremarket(true));
  }

  function liveNote(ctx) {
    const lv = ctx.live;
    if (!lv) return "";
    const hm = (t) => t ? String(t).slice(11, 16) : "";
    const parts = [];
    if (lv.overseas_fetched_at) parts.push(`外盘 ${hm(lv.overseas_fetched_at)}`);
    if (lv.notices_fetched_at) parts.push(`公告 ${hm(lv.notices_fetched_at)}${lv.notices_status === "partial" ? "（部分）" : lv.notices_status === "unavailable" ? "（失败）" : ""}`);
    const auc = ctx.auction;
    if (auc) parts.push(auc.mode === "open_fallback" ? `竞价按今开计 · ${hm(auc.captured_at)}` : `竞价 ${hm(auc.captured_at)} 锁定`);
    return parts.length ? `<span class="pm-note mono" title="09:30 后才打开且未在 09:25–09:30 抓到竞价时，跳空按今开计算、竞价量比显示 —">${esc(parts.join(" · "))}</span>` : "";
  }

  let pmPolls = 0;
  async function loadPremarket(refresh) {
    try {
      const ctx = await getJSON(`/api/premarket-context${refresh ? "?refresh=1" : ""}`);
      premarketCtx = ctx;
      renderPremarketPanel(ctx);
      if (latestPicks) renderPicks(latestPicks);
      const settled = !(ctx && ctx.live && ctx.live.refreshing);

  const BRAKE = { normal: "正常", reduced: "风险减半", liquidated: "暂停新开仓" };

  function renderPoolV2(pool) {

  const SKIP = { limit_up_fill: "涨停无法成交", fill_at_or_below_stop: "成交价跌破低点", session_ended: "收盘前未成交" };

  async function loadIntradayMonitor() {
    clearTimeout(monitorTimer);

  function renderIntradayMonitor(m) {
    if (!m) { $("intraday-monitor").innerHTML = '<div class="empty">尚无盘前计划：开盘前运行 scripts/monitor_momentum_intraday.py plan</div>'; return; }

      if (t && t.status === "filled") status = `${badge("trigger")} ${esc(t.trigger_time.slice(11))} 收复<br><span class="muted">成交 ${num(t.fill_price)} @ ${esc(t.fill_time.slice(11))} · 止损 ${num(t.stop)}${t.stop_capped ? "（4% 封顶）" : ""}</span>`;
      else if (t && t.status === "pending_fill") status = `${badge("trigger")} ${esc(t.trigger_time.slice(11))} 收复<br><span class="muted">等待下一分钟成交</span>`;

      const zone = r.zone ? `${num(r.zone.bottom)}–${num(r.zone.top)}` : "—";
      return `<tr class="click" data-symbol="${esc(r.symbol)}"><td>${esc(r.symbol)}<br><span class="muted">${esc(r.name || "")}</span></td><td class="num">${zone}<br><span class="muted">${(r.confluence_members || []).map((k) => esc(SUPPORT[k] || k)).join("、")}</span></td><td>${status}</td></tr>`;
    }).join("");
    const c = m.comparison;
    const cmp = c ? `<div class="note">前向账本截至 ${esc(c.as_of)}：${c.plan_days} 个计划日 · 盘中入场 ${c.intraday_entries} · 次日开盘入场 ${c.daily_entries} · 同一信号两者都入场 ${c.both_entered}（盘中较开盘 ${pct(c.mean_entry_gap, 2)}）· 已平仓 盘中 ${c.intraday_closed.count} 笔均值 ${pct(c.intraday_closed.mean_return, 2)} / 开盘 ${c.daily_closed.count} 笔均值 ${pct(c.daily_closed.mean_return, 2)}</div>` : "";

  function stockPremarketSection(symbol) {
    const pits = symbolPitfalls(symbol);
    const auc = symbolAuction(symbol);
    if (!pits.length && !auc) return "";
    const parts = [];
    if (auc && auc.auction_price != null) {
      const flags = Array.isArray(auc.flags) ? auc.flags : [];
      const flagPills = flags.map((f) => {
        const bad = ["at_limit_up_cannot_buy", "at_limit_down", "large_gap_down", "below_luk_stop", "stop_too_wide"].includes(f);
        return `<span class="itag ${bad ? "auc-bad" : "auc-warn"}">${esc(AUC_FLAG[f] || f)}</span>`;
      }).join(" ");
      parts.push(`<div class="stock-pm-metrics">
        <span>09:25 竞价 <b>${num(auc.auction_price, 2)}</b> (<b class="${Number(auc.gap_pct || 0) >= 0 ? "up" : "down"}">${signedPct(auc.gap_pct, 2)}</b>)</span>

        ${flagPills}
      </div>`);
    }
    for (const p of pits) {
      parts.push(`<div class="stock-pm-alert ${esc(p.severity || "medium")}"><b>${esc(PIT_LONG[p.kind] || p.kind)}</b> · ${esc(p.title || "")}${p.date ? ` <span class="mono muted">(${esc(p.date)})</span>` : ""}${p.detail ? `<div class="muted" style="margin-top:2px;font-size:11.5px">${esc(p.detail)}</div>` : ""}</div>`);
    }
    return `<div class="stock-pm-box">
      <div class="stock-pm-head"><span class="stock-pm-title">盘前排雷与 09:25 竞价检验</span><span class="mono muted" style="font-size:10.5px">${esc(premarketCtx && premarketCtx.signal_date ? `信号日 ${premarketCtx.signal_date}` : "")}</span></div>
      ${parts.join("")}
    </div>`;
  }

      <div class="checks">${checks}</div>

    document.querySelectorAll(".chart-tabs button").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));
    setView(view);
  }

  function setView(v) {
    view = v;
    clearTimeout(intradayTimer);
    document.querySelectorAll(".chart-tabs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === v)));
    $("legend-daily").hidden = v !== "daily";
    $("legend-intraday").hidden = v !== "intraday";
    if (v === "daily") { $("chart-note").textContent = ""; drawChart(current); }
    else {
      if (chart) { chart.remove(); chart = null; intraday = null; }
      $("chart").innerHTML = '<div class="empty">正在抓取分时…</div>';
      loadIntraday(current.symbol, false);
    }
  }

  function marketOpen() {
    const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Shanghai", weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date()).map((x) => [x.type, x.value]));
    if (p.weekday === "Sat" || p.weekday === "Sun") return false;
    const m = Number(p.hour) * 60 + Number(p.minute);
    return (m >= 570 && m <= 690) || (m >= 780 && m <= 900);
  }

  // 分时 is display only: fetched live on each request, never stored, never scored.
  async function loadIntraday(symbol, refresh) {
    clearTimeout(intradayTimer);
    let d;
    try { d = await getJSON(`/api/intraday?q=${encodeURIComponent(symbol)}`); }
    catch (e) { d = { error: `请求失败：${e.message}` }; }
    if (view !== "intraday" || !current || current.symbol !== symbol) return;
    const open = marketOpen();
    if (d.error) {
      if (!refresh || !intraday) {
        if (chart) { chart.remove(); chart = null; intraday = null; }
        $("chart").innerHTML = `<div class="empty">${esc(d.error)}</div>`;
      }
    } else {
      drawIntraday(d, refresh);
      const src = { minute_em: "东方财富", minute_sina: "新浪" }[d.source] || d.source;
      $("chart-note").textContent = `数据源：${src} · ${d.date}${open ? " · 交易中，每 30 秒刷新" : ""}`;
    }
    if (open) intradayTimer = setTimeout(() => loadIntraday(symbol, true), 30000);
  }

  function drawIntraday(d, refresh) {
    const el = $("chart");
    if (!window.LightweightCharts) { el.innerHTML = '<div class="empty">图表组件不可用</div>'; return; }
    if (!refresh || !intraday) {
      if (chart) { chart.remove(); chart = null; }
      el.innerHTML = "";
      chart = LightweightCharts.createChart(el, {
        autoSize: true,
        layout: { background: { color: "transparent" }, textColor: css("--text-muted"), fontFamily: "monospace" },
        grid: { vertLines: { visible: false }, horzLines: { color: css("--grid") } },
        rightPriceScale: { borderVisible: false, scaleMargins: { top: 0.08, bottom: 0.28 } },
        timeScale: { borderVisible: false, timeVisible: true, secondsVisible: false },
        crosshair: { mode: 0 },
      });
      intraday = {
        price: chart.addLineSeries({ color: css("--s1"), lineWidth: 2, priceLineVisible: false }),
        avg: chart.addLineSeries({ color: css("--s4"), lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false }),
        volume: chart.addHistogramSeries({ priceScaleId: "volume", priceFormat: { type: "volume" }, priceLineVisible: false, lastValueVisible: false }),
        prevLine: null,
      };
      chart.priceScale("volume").applyOptions({ scaleMargins: { top: 0.78, bottom: 0 } });
    }
    // Minute stamps are Shanghai wall-clock times; encoding them as UTC keeps the axis on that clock.
    const t = (s) => Date.parse(`${s.replace(" ", "T")}:00Z`) / 1000;
    intraday.price.setData(d.points.map((p) => ({ time: t(p.time), value: p.price })));
    intraday.avg.setData(d.points.map((p) => ({ time: t(p.time), value: p.avg })));
    intraday.volume.setData(d.points.map((p, i) => ({ time: t(p.time), value: p.volume, color: css(p.price >= (i ? d.points[i - 1].price : d.prev_close ?? p.price) ? "--up" : "--down") })));
    if (intraday.prevLine) intraday.price.removePriceLine(intraday.prevLine);
    intraday.prevLine = d.prev_close == null ? null : intraday.price.createPriceLine({ price: d.prev_close, color: css("--text-muted"), lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: "昨收" });
    if (!refresh) chart.timeScale().fitContent();
  }

  function drawChart(s) {
    const el = $("chart");
    if (!window.LightweightCharts) { el.innerHTML = '<div class="empty">图表组件不可用</div>'; return; }
    if (chart) { chart.remove(); chart = null; intraday = null; }
    el.innerHTML = "";
    const c = s.chart;
    chart = LightweightCharts.createChart(el, {
      autoSize: true,
      layout: { background: { color: "transparent" }, textColor: css("--text-muted"), fontFamily: "monospace" },
      grid: { vertLines: { visible: false }, horzLines: { color: css("--grid") } },
      rightPriceScale: { borderVisible: false }, timeScale: { borderVisible: false },
      crosshair: { mode: 0 },
    });
    const candles = chart.addCandlestickSeries({ upColor: css("--up"), downColor: css("--down"), borderVisible: false, wickUpColor: css("--up"), wickDownColor: css("--down") });
    candles.setData(c.dates.map((d, i) => ({ time: d, open: c.ohlc[i][0], high: c.ohlc[i][1], low: c.ohlc[i][2], close: c.ohlc[i][3] })));
    const lines = [["ema9", "--s4"], ["ema21", "--s1"], ["ema50", "--s7"], ["avwap_swing_low", "--s3"], ["avwap_swing_high", "--s2"]];
    lines.forEach(([k, col]) => {
      if (!c.lines[k]) return;
      const series = chart.addLineSeries({ color: css(col), lineWidth: 2, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
      series.setData(c.dates.map((d, i) => (c.lines[k][i] == null ? null : { time: d, value: c.lines[k][i] })).filter(Boolean));
    });
    const a = s.analysis;
    if (a.zone) {
      candles.createPriceLine({ price: a.zone.top, color: css("--accent"), lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: "共振上沿" });
      candles.createPriceLine({ price: a.zone.bottom, color: css("--accent"), lineWidth: 1, lineStyle: 2, axisLabelVisible: false, title: "共振下沿" });
    }
    if (a.state === "trigger") candles.createPriceLine({ price: a.stop, color: css("--critical"), lineWidth: 1, lineStyle: 0, axisLabelVisible: true, title: "止损" });
    chart.timeScale().fitContent();
  }

  const JEV_LABELS = { negative_event_risk: "负面事件风险", earnings_support: "财报支撑", catalyst_quality: "催化剂质量", crowding: "拥挤度", setup_consistency: "形态与基本面一致" };
  const KIND = { news: "新闻", notice: "公告", research: "研报", qa: "互动易", global: "全球" };

  async function loadResearch(symbol) {
    const el = $("research");
    el.hidden = false;
    el.innerHTML = '<div class="empty">正在汇总新闻、公告、研报、互动问答和财报…</div>';
    $("jev-panel").hidden = true;
    try { renderResearch(await getJSON(`/api/research?q=${encodeURIComponent(symbol)}`)); }
    catch (e) { el.innerHTML = `<div class="empty">信息汇总失败：${esc(e.message)}</div>`; }
  }

  function renderResearch(r) {
    const el = $("research");
    if (r.error) { el.innerHTML = `<div class="empty">${esc(r.error)}</div>`; return; }
    const chips = Object.values(r.sources).map((s) => `<span class="chip ${esc(s.status)}" title="${esc(s.error || "")}">${esc(s.label)}${s.count == null ? "" : " " + s.count}</span>`).join("");
    const events = Object.entries(r.nlp.event_counts).map(([t, n]) => `<span class="chip">${esc(t)} ×${n}</span>`).join("") || '<span class="muted">未识别到事件</span>';
    const items = r.items.map((i) => {
      const pol = i.polarity > 0 ? '<span class="pol-pos">▲</span> ' : i.polarity < 0 ? '<span class="pol-neg">▼</span> ' : "";
      const title = i.url ? `<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>` : esc(i.title);
      return `<div class="item">${pol}${title}<div class="meta">${esc(String(i.published_at).slice(0, 10))} · ${esc(KIND[i.kind] || i.kind)} · ${esc(i.source)}${i.tags && i.tags.length ? " · " + esc(i.tags.join("、")) : ""}${i.roundup ? " · 行情汇总，不计分" : ""}${i.relevance ? " · " + esc(i.relevance) : ""}${i.rating ? " · 评级 " + esc(i.rating) : ""}</div></div>`;
    }).join("");
    const fin = r.financials.map((f) => `<tr><td>${esc(f.period)}</td><td class="num">${pct(f.revenue_yoy)}</td><td class="num">${pct(f.net_profit_yoy)}</td><td class="num">${pct(f.deducted_profit_yoy)}</td><td class="num">${pct(f.roe)}</td><td class="num">${pct(f.net_margin)}</td></tr>`).join("");
    const flags = r.financial_trend.flags.map((f) => `<li class="${f.polarity > 0 ? "p1" : f.polarity < 0 ? "n1" : "z0"}">${esc(f.text)}</li>`).join("");
    const c = r.consensus;
    const ratings = Object.entries(c.ratings).map(([k, n]) => `${esc(k)} ${n}`).join(" · ") || "无";
    const eps = Object.entries(c.eps_forecast_median).map(([y, v]) => `${y}: ${num(v, 2)}`).join(" · ") || "无";
    el.innerHTML = `
      <div class="section-head"><h2>全平台信息 · NLP</h2><span class="right">抓取于 ${esc(String(r.fetched_at).slice(0, 16).replace("T", " "))} UTC · 按日缓存</span></div>
      <div class="chips">${chips}</div>
      <div class="hero-row"><div><div class="muted" style="font-size:11px">事件情绪（−1 ~ +1，14 天半衰期）</div><div class="big">${r.nlp.sentiment >= 0 ? "+" : ""}${num(r.nlp.sentiment, 2)} <span style="font-size:14px">${esc(r.nlp.label)}</span></div></div>
        <div class="muted mono" style="font-size:11px">规则识别到事件 ${r.nlp.tagged_items}/${r.nlp.total_items}${r.nlp.roundup_items ? ` · 行情汇总 ${r.nlp.roundup_items} 条不计分` : ""}</div></div>
      <div class="chips">${events}</div>${overseas(r.global)}
      <div id="events-llm"></div>
      <div class="items">${items || '<div class="empty">没有信息条目</div>'}</div>
      <div class="sub-grid" style="margin-top:14px">
        <div><div class="section-head"><h2>财报趋势</h2><span class="right">${esc(r.financial_trend.latest_period || "")}</span></div>
          <table><thead><tr><th>报告期</th><th class="num">营收同比</th><th class="num">净利同比</th><th class="num">扣非同比</th><th class="num">ROE</th><th class="num">净利率</th></tr></thead><tbody>${fin}</tbody></table>
          <ul class="flags">${flags}</ul></div>
        <div><div class="section-head"><h2>研报共识</h2><span class="right">近 ${c.window_days} 天</span></div>
          <div class="mono" style="font-size:12px;line-height:1.8">研报 ${c.reports} 篇 · 机构 ${c.institutions} 家<br>评级：${ratings}<br>看多占比：${pct(c.bullish_share, 0)}<br>EPS 预测中位数：${eps}</div></div>
      </div>`;
    const jevPanel = $("jev-panel");
    jevPanel.hidden = false;
    jevPanel.innerHTML = `
      <div class="section-head"><h2>Jev 综合判断</h2><span class="right">固定问题 → 概率或 JSON 作答 → SOFT 阈值</span></div>
      <div class="note" style="margin-bottom:10px">读取整份资料包，不只是 NLP：Luk 四步技术检查、多因子分及分项、大盘风险提示、NLP 情绪与事件、近期新闻/公告标题、研报共识、近 6 期财报（不含 v2 研究分）。只做多：结论为支持 / 中性 / 否决，否决＝回避，不是做空；仅供参考，不能推翻技术面的回避结论，也不改变计数策略。</div>
      <div id="jev"></div>`;
    renderJev(r.jev_record, r);
    renderEventsLlm(r.events_llm_result, r);
  }

  function overseas(g) {
    if (!g) return "";
    const rows = (g.overseas || []).map((o) => `<span class="chip"><b>${esc(o.label)}</b> <span class="${o.change > 0 ? "pol-pos" : o.change < 0 ? "pol-neg" : ""}">${o.change >= 0 ? "+" : ""}${pct(o.change)}</span> <span class="muted">${esc(o.date)}</span></span>`).join("") || '<span class="muted">海外行情暂不可用</span>';
    return `<div class="section-head" style="margin-top:12px"><h2>海外市场（最近一个美股交易日）</h2><span class="right">行业：${esc(g.industry || "未知")}${g.industry_keywords && g.industry_keywords.length ? ` · 相关词：${esc(g.industry_keywords.slice(0, 6).join("、"))}` : ""}</span></div>
      <div class="chips">${rows}</div>
      <div class="note">全球快讯只保留点名公司、命中行业关键词或带宏观事件标签的条目；美股指数涨跌 ≥1.5%、海外同业 ≥3% 时记为事件（权重低于公司公告）。</div>`;
  }

  function renderEventsLlm(result, r) {
    const el = $("events-llm");
    if (!result) {
      const ok = r.events_llm && r.events_llm.configured;
      el.innerHTML = `<button class="jev-btn" id="events-llm-run" ${ok ? "" : "disabled"}>LLM 辅助判定</button>
        <div class="note">${ok ? `${esc(r.events_llm.model)} 只给关键词规则没覆盖的条目打标签；规则结果不变，两种情绪并排显示。` : esc(r.events_llm ? r.events_llm.reason : "")}</div>${costBar(null, r.events_llm_spend)}`;
      const btn = $("events-llm-run");
      if (btn && ok) btn.addEventListener("click", async () => {
        btn.disabled = true; btn.textContent = "LLM 判定中…";
        try {
          const res = await fetch(`/api/events_llm?q=${encodeURIComponent(r.symbol)}`, { method: "POST" });
          const data = await res.json();
          if (data.error) { el.innerHTML = `<div class="empty">${esc(data.error)}</div>`; return; }
          renderEventsLlm(data, r);
        } catch (e) { el.innerHTML = `<div class="empty">LLM 辅助判定失败：${esc(e.message)}</div>`; }
      });
      return;
    }
    const rows = result.llm_items.map((i) => {
      const pol = i.polarity > 0 ? '<span class="pol-pos">▲</span> ' : i.polarity < 0 ? '<span class="pol-neg">▼</span> ' : "";
      return `<div class="item">${pol}${esc(i.title)}<div class="meta">${esc(String(i.published_at).slice(0, 10))} · ${esc(KIND[i.kind] || i.kind)} · LLM：${esc(i.label)}（${num(i.polarity, 1)}）· ${esc(i.reason)}</div></div>`;
    }).join("") || '<div class="muted">LLM 在规则未覆盖的条目里也没找到事件。</div>';
    el.innerHTML = `<div class="hero-row" style="margin-top:10px"><div><div class="muted" style="font-size:11px">规则 + LLM 事件情绪</div><div class="big">${result.sentiment >= 0 ? "+" : ""}${num(result.sentiment, 2)} <span style="font-size:14px">${esc(result.label)}</span></div></div>
        <div class="muted mono" style="font-size:11px">送审 ${result.sent_items} 条 · LLM 标注 ${result.llm_tagged} 条</div></div>
      <div class="items">${rows}</div>
      <div class="note">LLM 标签只填补规则空白，仅供研究参考，不进入任何评分、交易或证据链。</div>
      ${costBar(result, result.spend || r.events_llm_spend)}`;
  }

  const usd = (v) => (v == null ? "—" : v >= 0.01 ? `$${Number(v).toFixed(4)}` : `$${Number(v).toPrecision(3)}`);

  function costBar(record, spend) {
    const parts = [];
    if (record) {
      const u = record.usage || {};
      const tokens = u.input_tokens != null ? ` · ${u.input_tokens} 入 / ${u.output_tokens ?? 0} 出 token` : "";
      parts.push(`<span><span class="k">模型</span><b>${esc(record.served_model || record.model)}</b></span>`);
      parts.push(record.cached
        ? `<span><span class="k">本次</span>存档结果，未重复计费（原调用 ${usd(u.cost)}${tokens}）</span>`
        : `<span><span class="k">本次</span><b>${usd(u.cost)}</b>${tokens}</span>`);
      if (u.cost_estimated) parts.push('<span class="muted">DeepSeek 不返回费用，按官方分时价目由 token 计算</span>');
      else if (u.cost == null && !record.cached) parts.push('<span class="muted">该接口未返回费用，只显示 token</span>');
    }
    if (spend) {
      parts.push(`<span><span class="k">今日</span>${spend.today_calls} 次 · <b>${usd(spend.today_cost)}</b></span>`);
      parts.push(`<span><span class="k">累计</span>${spend.total_calls} 次 · <b>${usd(spend.total_cost)}</b>${spend.unpriced_calls ? `（另 ${spend.unpriced_calls} 次未计价）` : ""}</span>`);
    }
    return parts.length ? `<div class="cost">${parts.join("")}</div>` : "";
  }

  function renderJev(record, r) {
    const el = $("jev");
    if (!record) {
      const ok = r.jev && r.jev.configured;
      el.innerHTML = `<button class="jev-btn" id="jev-run" ${ok ? "" : "disabled"}>请 Jev 判断</button>
        <div class="note">${ok ? `${esc(r.jev.provider)} · ${esc(r.jev.model)}` : `Jev 未配置：${esc(r.jev ? r.jev.reason : "")}。`}</div>${costBar(null, r.jev_spend)}`;
      const btn = $("jev-run");
      if (btn && ok) btn.addEventListener("click", async () => {
        btn.disabled = true; btn.textContent = "Jev 思考中…";
        try {
          const res = await fetch(`/api/jev?q=${encodeURIComponent(r.symbol)}`, { method: "POST" });
          const data = await res.json();
          if (data.error) { el.innerHTML = `<div class="empty">${esc(data.error)}</div>`; return; }
          renderJev(data, r);
        } catch (e) { el.innerHTML = `<div class="empty">Jev 调用失败：${esc(e.message)}</div>`; }
      });
      return;
    }
    const rows = record.threshold_checks.map((c) => {
      const a = record.answers[c.id];
      return `<tr><td>${esc(JEV_LABELS[c.id] || c.id)}</td><td class="num">${num(c.score, 2)}</td><td>${esc(c.rule)}</td><td class="${c.passed ? "pass" : "fail"}">${c.passed ? "✓" : "✕"}</td><td>${esc(a.reason)}</td></tr>`;
    }).join("");
    el.innerHTML = `<div class="judgment ${esc(record.judgment)}">${esc({ support: "Jev 支持", neutral: "Jev 中性", veto: "Jev 否决" }[record.judgment])} · ${esc(record.combined)}</div>
      <div style="font-size:12.5px;margin-bottom:8px">${esc(record.summary)}</div>
      <table><thead><tr><th>问题</th><th class="num">分数</th><th>阈值</th><th></th><th>理由</th></tr></thead><tbody>${rows}</tbody></table>
      ${record.key_risks.length ? `<ul class="flags">${record.key_risks.map((k) => `<li class="n1">${esc(k)}</li>`).join("")}</ul>` : ""}
      <div class="note">${esc(record.provider)} · ${esc(record.model)} · 资料包 ${esc(record.packet_sha256.slice(0, 12))} · ${record.cached ? "存档结果" : "新调用"} · 仅供研究参考，不改变任何交易或证据</div>
      ${costBar(record, record.jev_spend || r.jev_spend)}`;
  }

  async function load(query) {
    if (!query) return;
    clearTimeout(intradayTimer);
    current = null;
    $("query").value = query;
    history.replaceState(null, "", `#${encodeURIComponent(query)}`);
    $("stock").innerHTML = '<div class="empty">分析中…</div>';
    $("research").hidden = true;
    $("jev-panel").hidden = true;
    try {
      const stock = await getJSON(`/api/stock?q=${encodeURIComponent(query)}`);
      renderStock(stock);
      if (!stock.error) loadResearch(stock.symbol);
    }
    catch (e) { $("stock").innerHTML = `<div class="empty">请求失败：${esc(e.message)}</div>`; }
  }

  $("search-form").addEventListener("submit", (e) => { e.preventDefault(); const q = $("query").value.split(" ")[0]; load(q); });

  (async () => {
    try {
      loadPremarket(false);
      const [universe, picks] = await Promise.all([getJSON("/api/universe"), getJSON("/api/picks")]);
      $("universe").innerHTML = universe.map((u) => `<option value="${esc(u.symbol)} ${esc(u.name)}${u.csi300 ? " · 沪深300" : ""}"></option>`).join("");
      renderPicks(picks);
      loadIntradayMonitor();
      const initial = decodeURIComponent(location.hash.slice(1)) || (picks.pool && picks.pool.pool[0] && picks.pool.pool[0].symbol) || (picks.candidates[0] && picks.candidates[0].symbol);
      if (initial) load(initial);
    } catch (e) {
      $("meta").textContent = `数据载入失败：${e.message}`;
    }
  })();
})();
</script>
</body>
</html>
