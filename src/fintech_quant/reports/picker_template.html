<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__PICKER_TITLE__</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0e0f13; --surface-1: #17181d; --surface-2: #1f2027; --border: #2c2d36;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8a897f;
  --accent: #e87ba4;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s7: #9085e9;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --up: #e66767; --down: #199e70; --grid: #26272e;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #eceae4; --surface-1: #fcfcfb; --surface-2: #f3f2ee; --border: #d9d7cf;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7972;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s7: #6250d6;
    --up: #d03b3b; --down: #008300; --grid: #e7e5df;
  }
}
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text-primary);
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; }
.wrap { max-width: 1440px; margin: 0 auto; padding: 12px 16px 32px; }
.panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; }
h2 { font: 600 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; margin: 0; color: var(--text-secondary); }
.muted { color: var(--text-muted); }
.mono { font-family: var(--mono); }
.topbar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 14px; margin-bottom: 10px; }
.brand { font: 800 18px/1 var(--mono); } .brand span { color: var(--accent); }
.nav { display: flex; gap: 4px; }
.nav a { font: 600 11px var(--mono); color: var(--text-secondary); text-decoration: none; border: 1px solid var(--border); border-radius: 4px; padding: 5px 9px; }
.nav a[aria-current="page"] { color: var(--text-primary); border-color: var(--accent); }
.meta { margin-left: auto; font: 11px var(--mono); color: var(--text-muted); text-align: right; }
.search { display: flex; gap: 8px; padding: 12px 14px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
.search input { flex: 1; min-width: 200px; font: 14px var(--mono); padding: 9px 11px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-primary); }
.search button { font: 600 13px var(--mono); padding: 9px 16px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #0b0b0b; cursor: pointer; }
.grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 10px; }
.section { padding: 12px 14px; margin-bottom: 10px; }
.section-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.section-head .right { margin-left: auto; font: 11px var(--mono); color: var(--text-muted); }
.stock-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
.stock-head .name { font: 800 22px var(--mono); }
.stock-head .px { font: 700 18px var(--mono); }
.verdict { border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; border: 1px solid var(--border); background: var(--surface-2); }
.verdict .head { font: 700 14px var(--mono); }
.verdict.entry .head::before { content: "● "; color: var(--good); }
.verdict.watch .head::before { content: "◐ "; color: var(--warning); }
.verdict.wait .head::before { content: "▲ "; color: var(--serious); }
.verdict.avoid .head::before { content: "✕ "; color: var(--critical); }
.verdict ul { margin: 6px 0 0; padding-left: 18px; color: var(--text-secondary); font-size: 12px; }
#chart { height: 360px; position: relative; }
.chart-tabs { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.chart-tabs button { font: 600 11px var(--mono); color: var(--text-secondary); background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 5px 11px; cursor: pointer; }
.chart-tabs button[aria-pressed="true"] { color: var(--text-primary); border-color: var(--accent); }
.chart-tabs .right { margin-left: auto; font: 11px var(--mono); color: var(--text-muted); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font: 11px var(--mono); color: var(--text-secondary); margin-top: 6px; }
.legend span::before { content: ""; display: inline-block; width: 14px; height: 2px; margin-right: 5px; vertical-align: middle; background: var(--c); }
.checks { display: grid; gap: 6px; }
.check { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; padding: 7px 8px; border-radius: 5px; background: var(--surface-2); }
.check .icon { font: 700 13px var(--mono); }
.check.ok .icon { color: var(--good); } .check.no .icon { color: var(--critical); }
.check .label { font-weight: 600; }
.check .detail { color: var(--text-secondary); font: 11.5px/1.5 var(--mono); }
.bars { display: grid; gap: 6px; }
.bar-row { display: grid; grid-template-columns: 90px 1fr 60px; gap: 8px; align-items: center; font: 11.5px var(--mono); }
.bar-row .track { height: 10px; background: var(--surface-2); border-radius: 0 3px 3px 0; overflow: hidden; }
.bar-row .track i { display: block; height: 100%; border-radius: 0 3px 3px 0; }
table { width: 100%; border-collapse: collapse; font: 11.5px var(--mono); }
th { text-align: left; font-weight: 600; color: var(--text-muted); padding: 4px 6px; border-bottom: 1px solid var(--border); }
td { padding: 5px 6px; border-bottom: 1px solid var(--grid); color: var(--text-secondary); }
td.num, th.num { text-align: right; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
.badge { font: 600 10px var(--mono); padding: 2px 6px; border-radius: 3px; border: 1px solid var(--border); white-space: nowrap; }
.badge.trigger { border-color: var(--good); color: var(--text-primary); }
.badge.trigger::before { content: "● "; color: var(--good); }
.badge.setup::before { content: "◐ "; color: var(--warning); }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
.kpi { background: var(--surface-2); border-radius: 6px; padding: 8px 10px; }
.kpi .v { font: 700 16px var(--mono); } .kpi .l { font-size: 11px; color: var(--text-muted); }
.note { font-size: 11.5px; color: var(--text-muted); margin-top: 8px; }
.empty { padding: 24px; text-align: center; color: var(--text-muted); }
.up { color: var(--up); } .down { color: var(--down); }
.pass { color: var(--good); } .fail { color: var(--critical); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip { font: 11px var(--mono); border: 1px solid var(--border); border-radius: 4px; padding: 3px 7px; color: var(--text-secondary); }
.chip.ok::before { content: "● "; color: var(--good); }
.chip.empty::before { content: "○ "; color: var(--text-muted); }
.chip.failed::before, .chip.timeout::before { content: "✕ "; color: var(--critical); }
.chip.pos::before { content: "▲ "; color: var(--up); }
.chip.neg::before { content: "▼ "; color: var(--down); }
.hero-row { display: flex; gap: 22px; align-items: baseline; flex-wrap: wrap; margin-bottom: 10px; }
.hero-row .big { font: 800 24px var(--mono); }
.items { max-height: 320px; overflow: auto; }
.item { padding: 6px 0; border-bottom: 1px dashed var(--grid); font-size: 12px; }
.item .meta { font: 10.5px var(--mono); color: var(--text-muted); }
.item a { color: var(--text-primary); text-decoration: none; }
.item a:hover { text-decoration: underline; }
.item .pol-pos { color: var(--up); } .item .pol-neg { color: var(--down); }
.flags { margin: 8px 0 0; padding-left: 0; list-style: none; font-size: 12px; }
.flags li::before { margin-right: 6px; }
.flags li.p1::before { content: "▲"; color: var(--up); }
.flags li.n1::before { content: "▼"; color: var(--down); }
.flags li.z0::before { content: "●"; color: var(--text-muted); }
.jev-btn { font: 600 13px var(--mono); padding: 8px 14px; border-radius: 6px; border: 1px solid var(--accent); background: transparent; color: var(--text-primary); cursor: pointer; }
.jev-btn[disabled] { opacity: .5; cursor: not-allowed; }
.judgment { font: 700 15px var(--mono); margin: 8px 0; }
.judgment.support::before { content: "● "; color: var(--good); }
.judgment.neutral::before { content: "◐ "; color: var(--warning); }
.judgment.veto::before { content: "✕ "; color: var(--critical); }
.cost { margin-top: 10px; padding: 8px 10px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--border);
  font: 11.5px/1.7 var(--mono); color: var(--text-secondary); display: flex; flex-wrap: wrap; gap: 4px 16px; }
.cost b { color: var(--text-primary); font-weight: 700; }
.cost .k { color: var(--text-muted); margin-right: 4px; }
.sub-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 1000px) { .sub-grid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 1000px) { .grid { grid-template-columns: minmax(0, 1fr); } .meta { margin-left: 0; text-align: left; } }
@media (max-width: 520px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } #chart { height: 280px; } .bar-row { grid-template-columns: 70px 1fr 50px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="panel topbar">
    <div class="brand">VIBE<span>·</span>DESK</div>
    <nav class="nav"><a href="/">交易桌</a><a href="/picks" aria-current="page">选股</a></nav>
    <div class="meta" id="meta">载入中…</div>
  </header>

  <form class="panel search" id="search-form" autocomplete="off">
    <input id="query" list="universe" placeholder="搜索任意 A 股代码或名称，例如 601398、工商银行、300624" aria-label="股票代码或名称">
    <datalist id="universe"></datalist>
    <button type="submit">分析</button>
    <span class="muted mono" style="font-size:11px">Martin Luk 四步：强势股 → 整理平台 → 平台内强度 → 支撑共振急跌收复</span>
  </form>

  <div class="grid">
    <main>
      <section class="panel section" id="stock"><div class="empty">搜索一只股票，或点击右侧候选。</div></section>
      <section class="panel section" id="research" hidden></section>
    </main>
    <aside>
      <section class="panel section">
        <div class="section-head"><h2>自动化交易池 · TOP 5</h2><span class="right" id="pool-meta"></span></div>
        <div id="pool"></div>
      </section>
      <section class="panel section">
        <div class="section-head"><h2>影子池 v2 · 观察名单 + 风险仓位</h2><span class="right" id="pool-v2-meta"></span></div>
        <div id="pool-v2"></div>
      </section>
      <section class="panel section">
        <div class="section-head"><h2>候选 · 触发与观察</h2><span class="right" id="cand-meta"></span></div>
        <div id="candidates"></div>
      </section>
    </aside>
  </div>
</div>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pct = (v, d = 1) => (v == null ? "—" : `${(v * 100).toFixed(d)}%`);
  const num = (v, d = 2) => (v == null ? "—" : Number(v).toFixed(d));
  const STATE = { trigger: "触发", setup: "观察", leader_weak_base: "强势·弱平台", leader_no_base: "强势·无平台", avoid: "回避" };
  const SUPPORT = { ema9: "9 EMA", ema21: "21 EMA", ema50: "50 EMA", avwap_swing_low: "AVWAP·低点", avwap_swing_high: "AVWAP·高点", prior_pivot: "前高", gap: "缺口" };
  let chart = null, intraday = null, current = null, view = "daily", intradayTimer = null;

  async function getJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error(`${r.status}`); return r.json(); }

  function badge(state) { return `<span class="badge ${state}">${esc(STATE[state] || state)}</span>`; }

  function renderPicks(p) {
    $("meta").innerHTML = `数据截至 <b>${esc(p.as_of)}</b> · 筛选 ${p.universe_size} 只 · 触发 ${p.state_counts.trigger || 0} · 观察 ${p.state_counts.setup || 0}<br>池子固定在每个交易日 18:30（收盘周期之后）刷新`;
    const pool = p.pool;
    if (!pool) {
      $("pool").innerHTML = '<div class="empty">池子尚未初始化：运行 scripts/refresh_momentum_pool.py</div>';
    } else {
      const m = pool.metrics;
      $("pool-meta").textContent = `刷新于 ${pool.as_of}`;
      const rows = pool.pool.map((r) => `<tr class="click" data-symbol="${esc(r.symbol)}"><td>${esc(r.symbol)}<br><span class="muted">${esc(r.name || "")}</span></td><td>${badge(r.state)}</td><td class="num">${pct(r.stop_pct)}</td><td class="num">${r.confluence ?? "—"}</td><td class="num">${num(r.reward_r, 1)}R</td></tr>`).join("");
      const pending = pool.pending.map((r) => esc(r.symbol)).join("、") || "无";
      const held = Object.entries(pool.positions).map(([s, x]) => `<tr class="click" data-symbol="${esc(s)}"><td>${esc(s)}</td><td>${esc(x.entry_date)}</td><td class="num ${x.unrealized >= 0 ? "up" : "down"}">${x.unrealized == null ? "—" : (x.unrealized >= 0 ? "+" : "") + pct(x.unrealized)}</td></tr>`).join("");
      $("pool").innerHTML = `<div class="kpis">
          <div class="kpi"><div class="v">¥${Math.round(m.equity).toLocaleString()}</div><div class="l">影子权益</div></div>
          <div class="kpi"><div class="v">${pct(m.total_return)}</div><div class="l">累计 · ${m.sessions} 个交易日</div></div>
          <div class="kpi"><div class="v">${pct(m.max_drawdown)}</div><div class="l">最大回撤</div></div></div>
        <table><thead><tr><th>标的</th><th>状态</th><th class="num">止损</th><th class="num">共振</th><th class="num">至前高</th></tr></thead><tbody>${rows}</tbody></table>
        <div class="note">下个交易日开盘拟买入：${pending}</div>
        ${held ? `<table style="margin-top:8px"><thead><tr><th>持仓</th><th>入场</th><th class="num">浮动</th></tr></thead><tbody>${held}</tbody></table>` : ""}
        <div class="note">影子账户：独立于 V2 计数账户，不改变证据窗口；止损 = 信号日低点，收盘跌破 9 EMA 离场；按 hfq 价格计收益（含分红），T+1。</div>`;
    }
    renderPoolV2(p.pool_v2);
    $("cand-meta").textContent = `${p.candidates.length} 只`;
    $("candidates").innerHTML = p.candidates.length ? `<table><thead><tr><th>标的</th><th>状态</th><th class="num">动量</th><th class="num">共振</th><th class="num">止损</th><th class="num">基线</th></tr></thead><tbody>${
      p.candidates.map((r) => `<tr class="click" data-symbol="${esc(r.symbol)}"><td>${esc(r.symbol)} <span class="muted">${esc(r.name)}</span></td><td>${badge(r.state)}</td><td class="num">${pct(r.momentum_pct, 0)}</td><td class="num">${r.confluence}</td><td class="num">${pct(r.stop_pct)}</td><td class="num">${r.baseline_total == null ? "—" : num(r.baseline_total, 1)}</td></tr>`).join("")}</tbody></table>` : '<div class="empty">今天没有符合条件的候选。</div>';
    document.querySelectorAll("tr.click").forEach((tr) => tr.addEventListener("click", () => load(tr.dataset.symbol)));
  }

  const BRAKE = { normal: "正常", reduced: "风险减半", liquidated: "暂停新开仓" };
  const EXIT = { gap_below_stop: "跳空破止损", stop: "止损", close_below_ema9: "破 9 EMA", close_below_ema21: "破 21 EMA", profit_giveback: "利润回吐", time_stop: "时间止损", invalidated: "转为回避" };

  function renderPoolV2(pool) {
    if (!pool) { $("pool-v2").innerHTML = '<div class="empty">v2 尚未初始化：运行 scripts/refresh_momentum_pool_v2.py</div>'; return; }
    const m = pool.metrics;
    $("pool-v2-meta").textContent = `刷新于 ${pool.as_of}${pool.stale ? " · 未更新" : ""}`;
    const watch = pool.watchlist.map((r) => `<tr class="click" data-symbol="${esc(r.symbol)}"><td>${esc(r.symbol)}<br><span class="muted">${esc(r.name || "")}</span></td><td>${badge(r.state)}</td><td class="num">${r.age}/10</td><td class="num">${pct(r.stop_pct)}</td></tr>`).join("");
    const held = Object.entries(pool.positions).map(([s, x]) => `<tr class="click" data-symbol="${esc(s)}"><td>${esc(s)}<br><span class="muted">${esc(x.name || "")} · ${esc(x.entry_date)}</span></td><td class="num ${x.r_multiple >= 0 ? "up" : "down"}">${num(x.r_multiple, 2)}R<br><span class="muted">峰值 ${num(x.peak_r, 1)}R</span></td><td>${x.trail === "ema21" ? "21 EMA" : "9 EMA"} 跟踪${x.giveback_armed ? `<br><span class="muted">回吐线 ${num(x.giveback_exit_r, 2)}R</span>` : ""}</td><td class="num">${x.time_stop_active ? "时间止损生效" : `${x.time_stop_in} 日后`}</td></tr>`).join("");
    const closed = pool.closed_trades.slice(-5).reverse().map((t) => `<tr><td>${esc(t.symbol)}</td><td>${esc(t.exit_date)}</td><td>${esc(EXIT[t.reason] || t.reason)}</td><td class="num ${t.r_multiple >= 0 ? "up" : "down"}">${num(t.r_multiple, 2)}R</td></tr>`).join("");
    const pending = pool.pending.map((r) => esc(r.symbol)).join("、") || "无";
    $("pool-v2").innerHTML = `<div class="kpis">
        <div class="kpi"><div class="v">¥${Math.round(m.equity).toLocaleString()}</div><div class="l">影子权益 · ${m.positions}/8 仓</div></div>
        <div class="kpi"><div class="v">${pct(m.total_return)}</div><div class="l">累计 · 回撤 ${pct(m.drawdown)}</div></div>
        <div class="kpi"><div class="v">${esc(BRAKE[m.brake] || m.brake)}</div><div class="l">组合刹车</div></div></div>
      ${watch ? `<table><thead><tr><th>观察名单</th><th>状态</th><th class="num">天数</th><th class="num">止损</th></tr></thead><tbody>${watch}</tbody></table>` : '<div class="empty">观察名单为空</div>'}
      <div class="note">下个交易日开盘拟买入：${pending}</div>
      ${held ? `<table style="margin-top:8px"><thead><tr><th>持仓</th><th class="num">R 倍数</th><th>离场规则</th><th class="num">时间止损</th></tr></thead><tbody>${held}</tbody></table>` : ""}
      ${closed ? `<table style="margin-top:8px"><thead><tr><th>最近平仓</th><th>日期</th><th>原因</th><th class="num">R</th></tr></thead><tbody>${closed}</tbody></table>` : ""}
      <div class="note">v2 预先声明规则：每日前 5 进入观察名单（10 日未触发、转为回避或买入即移出，上限 20）；触发后次日开盘买入，单笔风险 0.75% 权益、单仓 ≤ 15%、止损距离 > 4% 不买，最多 8 仓；离场依次为止损、9 EMA（达 2R 后改 21 EMA）、回吐一半峰值利润、15 日未到 1R、转为回避；回撤 8% 风险减半、10% 暂停新开仓、按无刹车影子账户回到 8%/6% 恢复。不计入 V2 证据。</div>`;
  }

  function renderStock(s) {
    if (s.error) { $("stock").innerHTML = `<div class="empty">${esc(s.error)}</div>`; return; }
    const a = s.analysis, v = s.verdict, m = a.momentum || {};
    const checks = (a.checks || []).map((c) => `<div class="check ${c.passed ? "ok" : "no"}"><span class="icon">${c.passed ? "✓" : "✕"}</span><div><div class="label">${esc(c.step)}. ${esc(c.label)}</div><div class="detail">${esc(c.detail)}</div></div></div>`).join("") || '<div class="empty">今日无可分析的数据。</div>';
    const comps = s.baseline && s.baseline.components ? [["fundamental", "基本面", "--s1"], ["technical", "技术面", "--s2"], ["capital_flow", "资金代理", "--s3"], ["sentiment", "情绪", "--s4"]].map(([k, l, c]) => {
      const x = s.baseline.components[k] || { score: 0, max_score: 1 };
      return `<div class="bar-row"><span>${l}</span><div class="track"><i style="width:${(x.score / x.max_score) * 100}%;background:var(${c})"></i></div><span style="text-align:right">${num(x.score, 1)}/${num(x.max_score, 0)}</span></div>`;
    }).join("") : '<div class="muted">今日无多因子评分（可能停牌）。</div>';
    const v2 = s.scoring_v2;
    const v2Bars = v2 && v2.categories ? [["value", "价值", "--s1"], ["quality_growth", "质量/成长", "--s2"], ["low_risk", "低风险", "--s3"], ["liquidity", "低换手", "--s4"], ["reversal", "短期反转", "--s7"], ["momentum", "动量 12-1", "--s1"]].map(([k, l, c]) => {
      const x = v2.categories[k];
      return `<div class="bar-row"><span>${l} <span class="muted">${num(x.weight * 100, 0)}%</span></span><div class="track"><i style="width:${x.percentile}%;background:var(${c})"></i></div><span style="text-align:right">${num(x.percentile, 0)}</span></div>`;
    }).join("") : '<div class="muted">今日无 v2 研究评分（缺少行业/市值或全部因子）。</div>';
    const v2Section = v2 ? `
      <div class="section-head" style="margin-top:14px"><h2>研究评分 v2（排名合成）</h2><span class="right">${v2.score == null ? "" : `${num(v2.score, 1)} 分位 · 覆盖 ${pct(v2.coverage, 0)}`}</span></div>
      <div class="bars">${v2Bars}</div>
      <div class="note">${esc(v2.label)}${v2.stale ? `；快照日期 ${esc(v2.as_of)}，不是今日` : ""}。分位为沪深 300 截面排名（0–100），类别条为各类别的截面分位，类别名旁为训练期 ICIR 权重；缺失因子按中性 0 处理并降低覆盖率。方向按训练期 ICIR 对齐${v2.inverted && v2.inverted.length ? `，以下因子取负（数值越低排名越高）：${esc(v2.inverted.join("、"))}` : ""}。</div>` : "";
    const zone = a.zone ? `共振区 ${num(a.zone.bottom)}–${num(a.zone.top)}` : "无共振区";
    $("stock").innerHTML = `
      <div class="stock-head"><span class="name">${esc(s.name)}</span><span class="mono muted">${esc(s.symbol)}</span>
        <span class="px">${num(a.close)}</span><span class="muted mono">截至 ${esc(s.as_of)} · ${s.mode === "live" ? `<span class="badge">全市场 · 实时抓取（前复权，${esc(s.price_source)}）</span> 动量参照${esc(s.reference)}` : `<span class="badge">沪深300 · 时点数据</span> 筛选排名 ${s.rank ?? "—"}/${s.rank_of}`}</span></div>
      <div class="verdict ${esc(v.level)}"><div class="head">${esc(v.headline)}</div>
        <ul>${[...(a.state === "trigger" ? [`参考止损 ${num(a.stop)}（${pct(a.stop_pct)}），至前高约 ${num(a.reward_r, 1)}R`] : []), `${zone}`, ...v.notes].map((n) => `<li>${esc(n)}</li>`).join("")}</ul>
        <div class="note">${esc(v.disclaimer)}</div></div>
      <div class="chart-tabs"><button type="button" data-view="daily">日K</button><button type="button" data-view="intraday">分时</button><span class="right" id="chart-note"></span></div>
      <div id="chart"></div>
      <div class="legend" id="legend-intraday" hidden><span style="--c:var(--s1)">价格</span><span style="--c:var(--s4)">均价</span><span style="--c:var(--text-muted)">昨收</span><span style="--c:var(--up)">成交量（股）</span></div>
      <div class="legend" id="legend-daily"><span style="--c:var(--s4)">9 EMA</span><span style="--c:var(--s1)">21 EMA</span><span style="--c:var(--s7)">50 EMA</span><span style="--c:var(--s3)">AVWAP·低点</span><span style="--c:var(--s2)">AVWAP·高点</span><span style="--c:var(--accent)">止损 / 共振区</span></div>
      <div class="section-head" style="margin-top:14px"><h2>Luk 四步检查</h2><span class="right">动量 1M ${pct(m.r21)} · 3M ${pct(m.r63)} · 6M ${pct(m.r126)}</span></div>
      <div class="checks">${checks}</div>
      <div class="section-head" style="margin-top:14px"><h2>${s.mode === "live" ? "多因子实时参考分" : "多因子基线评分"}</h2><span class="right">${s.baseline ? `${num(s.baseline.total, 1)} 分 · 置信 ${num(s.baseline.confidence)}` : ""}</span></div>
      <div class="bars">${comps}</div>${v2Section}`;
    current = s;
    document.querySelectorAll(".chart-tabs button").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));
    setView(view);
  }

  function setView(v) {
    view = v;
    clearTimeout(intradayTimer);
    document.querySelectorAll(".chart-tabs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === v)));
    $("legend-daily").hidden = v !== "daily";
    $("legend-intraday").hidden = v !== "intraday";
    if (v === "daily") { $("chart-note").textContent = ""; drawChart(current); }
    else {
      if (chart) { chart.remove(); chart = null; intraday = null; }
      $("chart").innerHTML = '<div class="empty">正在抓取分时…</div>';
      loadIntraday(current.symbol, false);
    }
  }

  function marketOpen() {
    const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Shanghai", weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date()).map((x) => [x.type, x.value]));
    if (p.weekday === "Sat" || p.weekday === "Sun") return false;
    const m = Number(p.hour) * 60 + Number(p.minute);
    return (m >= 570 && m <= 690) || (m >= 780 && m <= 900);
  }

  // 分时 is display only: fetched live on each request, never stored, never scored.
  async function loadIntraday(symbol, refresh) {
    clearTimeout(intradayTimer);
    let d;
    try { d = await getJSON(`/api/intraday?q=${encodeURIComponent(symbol)}`); }
    catch (e) { d = { error: `请求失败：${e.message}` }; }
    if (view !== "intraday" || !current || current.symbol !== symbol) return;
    const open = marketOpen();
    if (d.error) {
      if (!refresh || !intraday) {
        if (chart) { chart.remove(); chart = null; intraday = null; }
        $("chart").innerHTML = `<div class="empty">${esc(d.error)}</div>`;
      }
    } else {
      drawIntraday(d, refresh);
      const src = { minute_em: "东方财富", minute_sina: "新浪" }[d.source] || d.source;
      $("chart-note").textContent = `数据源：${src} · ${d.date}${open ? " · 交易中，每 30 秒刷新" : ""}`;
    }
    if (open) intradayTimer = setTimeout(() => loadIntraday(symbol, true), 30000);
  }

  function drawIntraday(d, refresh) {
    const el = $("chart");
    if (!window.LightweightCharts) { el.innerHTML = '<div class="empty">图表组件不可用</div>'; return; }
    if (!refresh || !intraday) {
      if (chart) { chart.remove(); chart = null; }
      el.innerHTML = "";
      chart = LightweightCharts.createChart(el, {
        autoSize: true,
        layout: { background: { color: "transparent" }, textColor: css("--text-muted"), fontFamily: "monospace" },
        grid: { vertLines: { visible: false }, horzLines: { color: css("--grid") } },
        rightPriceScale: { borderVisible: false, scaleMargins: { top: 0.08, bottom: 0.28 } },
        timeScale: { borderVisible: false, timeVisible: true, secondsVisible: false },
        crosshair: { mode: 0 },
      });
      intraday = {
        price: chart.addLineSeries({ color: css("--s1"), lineWidth: 2, priceLineVisible: false }),
        avg: chart.addLineSeries({ color: css("--s4"), lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false }),
        volume: chart.addHistogramSeries({ priceScaleId: "volume", priceFormat: { type: "volume" }, priceLineVisible: false, lastValueVisible: false }),
        prevLine: null,
      };
      chart.priceScale("volume").applyOptions({ scaleMargins: { top: 0.78, bottom: 0 } });
    }
    // Minute stamps are Shanghai wall-clock times; encoding them as UTC keeps the axis on that clock.
    const t = (s) => Date.parse(`${s.replace(" ", "T")}:00Z`) / 1000;
    intraday.price.setData(d.points.map((p) => ({ time: t(p.time), value: p.price })));
    intraday.avg.setData(d.points.map((p) => ({ time: t(p.time), value: p.avg })));
    intraday.volume.setData(d.points.map((p, i) => ({ time: t(p.time), value: p.volume, color: css(p.price >= (i ? d.points[i - 1].price : d.prev_close ?? p.price) ? "--up" : "--down") })));
    if (intraday.prevLine) intraday.price.removePriceLine(intraday.prevLine);
    intraday.prevLine = d.prev_close == null ? null : intraday.price.createPriceLine({ price: d.prev_close, color: css("--text-muted"), lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: "昨收" });
    if (!refresh) chart.timeScale().fitContent();
  }

  function drawChart(s) {
    const el = $("chart");
    if (!window.LightweightCharts) { el.innerHTML = '<div class="empty">图表组件不可用</div>'; return; }
    if (chart) { chart.remove(); chart = null; intraday = null; }
    el.innerHTML = "";
    const c = s.chart;
    chart = LightweightCharts.createChart(el, {
      autoSize: true,
      layout: { background: { color: "transparent" }, textColor: css("--text-muted"), fontFamily: "monospace" },
      grid: { vertLines: { visible: false }, horzLines: { color: css("--grid") } },
      rightPriceScale: { borderVisible: false }, timeScale: { borderVisible: false },
      crosshair: { mode: 0 },
    });
    const candles = chart.addCandlestickSeries({ upColor: css("--up"), downColor: css("--down"), borderVisible: false, wickUpColor: css("--up"), wickDownColor: css("--down") });
    candles.setData(c.dates.map((d, i) => ({ time: d, open: c.ohlc[i][0], high: c.ohlc[i][1], low: c.ohlc[i][2], close: c.ohlc[i][3] })));
    const lines = [["ema9", "--s4"], ["ema21", "--s1"], ["ema50", "--s7"], ["avwap_swing_low", "--s3"], ["avwap_swing_high", "--s2"]];
    lines.forEach(([k, col]) => {
      if (!c.lines[k]) return;
      const series = chart.addLineSeries({ color: css(col), lineWidth: 2, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
      series.setData(c.dates.map((d, i) => (c.lines[k][i] == null ? null : { time: d, value: c.lines[k][i] })).filter(Boolean));
    });
    const a = s.analysis;
    if (a.zone) {
      candles.createPriceLine({ price: a.zone.top, color: css("--accent"), lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: "共振上沿" });
      candles.createPriceLine({ price: a.zone.bottom, color: css("--accent"), lineWidth: 1, lineStyle: 2, axisLabelVisible: false, title: "共振下沿" });
    }
    if (a.state === "trigger") candles.createPriceLine({ price: a.stop, color: css("--critical"), lineWidth: 1, lineStyle: 0, axisLabelVisible: true, title: "止损" });
    chart.timeScale().fitContent();
  }

  const JEV_LABELS = { negative_event_risk: "负面事件风险", earnings_support: "财报支撑", catalyst_quality: "催化剂质量", crowding: "拥挤度", setup_consistency: "形态与基本面一致" };
  const KIND = { news: "新闻", notice: "公告", research: "研报", qa: "互动易" };

  async function loadResearch(symbol) {
    const el = $("research");
    el.hidden = false;
    el.innerHTML = '<div class="empty">正在汇总新闻、公告、研报、互动问答和财报…</div>';
    try { renderResearch(await getJSON(`/api/research?q=${encodeURIComponent(symbol)}`)); }
    catch (e) { el.innerHTML = `<div class="empty">信息汇总失败：${esc(e.message)}</div>`; }
  }

  function renderResearch(r) {
    const el = $("research");
    if (r.error) { el.innerHTML = `<div class="empty">${esc(r.error)}</div>`; return; }
    const chips = Object.values(r.sources).map((s) => `<span class="chip ${esc(s.status)}" title="${esc(s.error || "")}">${esc(s.label)} ${s.count}</span>`).join("");
    const events = Object.entries(r.nlp.event_counts).map(([t, n]) => `<span class="chip">${esc(t)} ×${n}</span>`).join("") || '<span class="muted">未识别到事件</span>';
    const items = r.items.map((i) => {
      const pol = i.polarity > 0 ? '<span class="pol-pos">▲</span> ' : i.polarity < 0 ? '<span class="pol-neg">▼</span> ' : "";
      const title = i.url ? `<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>` : esc(i.title);
      return `<div class="item">${pol}${title}<div class="meta">${esc(String(i.published_at).slice(0, 10))} · ${esc(KIND[i.kind] || i.kind)} · ${esc(i.source)}${i.tags && i.tags.length ? " · " + esc(i.tags.join("、")) : ""}${i.rating ? " · 评级 " + esc(i.rating) : ""}</div></div>`;
    }).join("");
    const fin = r.financials.map((f) => `<tr><td>${esc(f.period)}</td><td class="num">${pct(f.revenue_yoy)}</td><td class="num">${pct(f.net_profit_yoy)}</td><td class="num">${pct(f.deducted_profit_yoy)}</td><td class="num">${pct(f.roe)}</td><td class="num">${pct(f.net_margin)}</td></tr>`).join("");
    const flags = r.financial_trend.flags.map((f) => `<li class="${f.polarity > 0 ? "p1" : f.polarity < 0 ? "n1" : "z0"}">${esc(f.text)}</li>`).join("");
    const c = r.consensus;
    const ratings = Object.entries(c.ratings).map(([k, n]) => `${esc(k)} ${n}`).join(" · ") || "无";
    const eps = Object.entries(c.eps_forecast_median).map(([y, v]) => `${y}: ${num(v, 2)}`).join(" · ") || "无";
    el.innerHTML = `
      <div class="section-head"><h2>全平台信息 · NLP</h2><span class="right">抓取于 ${esc(String(r.fetched_at).slice(0, 16).replace("T", " "))} UTC · 按日缓存</span></div>
      <div class="chips">${chips}</div>
      <div class="hero-row"><div><div class="muted" style="font-size:11px">事件情绪（−1 ~ +1，14 天半衰期）</div><div class="big">${r.nlp.sentiment >= 0 ? "+" : ""}${num(r.nlp.sentiment, 2)} <span style="font-size:14px">${esc(r.nlp.label)}</span></div></div>
        <div class="muted mono" style="font-size:11px">识别到事件的条目 ${r.nlp.tagged_items}/${r.nlp.total_items}</div></div>
      <div class="chips">${events}</div>
      <div class="items">${items || '<div class="empty">没有信息条目</div>'}</div>
      <div class="sub-grid" style="margin-top:14px">
        <div><div class="section-head"><h2>财报趋势</h2><span class="right">${esc(r.financial_trend.latest_period || "")}</span></div>
          <table><thead><tr><th>报告期</th><th class="num">营收同比</th><th class="num">净利同比</th><th class="num">扣非同比</th><th class="num">ROE</th><th class="num">净利率</th></tr></thead><tbody>${fin}</tbody></table>
          <ul class="flags">${flags}</ul></div>
        <div><div class="section-head"><h2>研报共识</h2><span class="right">近 ${c.window_days} 天</span></div>
          <div class="mono" style="font-size:12px;line-height:1.8">研报 ${c.reports} 篇 · 机构 ${c.institutions} 家<br>评级：${ratings}<br>看多占比：${pct(c.bullish_share, 0)}<br>EPS 预测中位数：${eps}</div></div>
      </div>
      <div class="section-head" style="margin-top:16px"><h2>Jev 判断</h2><span class="right">固定问题 → 概率或 JSON 作答 → SOFT 阈值</span></div>
      <div id="jev"></div>`;
    renderJev(r.jev_record, r);
  }

  const usd = (v) => (v == null ? "—" : v >= 0.01 ? `$${Number(v).toFixed(4)}` : `$${Number(v).toPrecision(3)}`);

  function costBar(record, spend) {
    const parts = [];
    if (record) {
      const u = record.usage || {};
      const tokens = u.input_tokens != null ? ` · ${u.input_tokens} 入 / ${u.output_tokens ?? 0} 出 token` : "";
      parts.push(`<span><span class="k">模型</span><b>${esc(record.served_model || record.model)}</b></span>`);
      parts.push(record.cached
        ? `<span><span class="k">本次</span>存档结果，未重复计费（原调用 ${usd(u.cost)}${tokens}）</span>`
        : `<span><span class="k">本次</span><b>${usd(u.cost)}</b>${tokens}</span>`);
      if (u.cost == null && !record.cached) parts.push('<span class="muted">该接口未返回费用，只显示 token</span>');
    }
    if (spend) {
      parts.push(`<span><span class="k">今日</span>${spend.today_calls} 次 · <b>${usd(spend.today_cost)}</b></span>`);
      parts.push(`<span><span class="k">累计</span>${spend.total_calls} 次 · <b>${usd(spend.total_cost)}</b>${spend.unpriced_calls ? `（另 ${spend.unpriced_calls} 次未计价）` : ""}</span>`);
    }
    return parts.length ? `<div class="cost">${parts.join("")}</div>` : "";
  }

  function renderJev(record, r) {
    const el = $("jev");
    if (!record) {
      const ok = r.jev && r.jev.configured;
      el.innerHTML = `<button class="jev-btn" id="jev-run" ${ok ? "" : "disabled"}>请 Jev 判断</button>
        <div class="note">${ok ? `${esc(r.jev.provider)} · ${esc(r.jev.model)} · 同一资料包只调用一次，结果存档` : `Jev 未配置：${esc(r.jev ? r.jev.reason : "")}。`}</div>${costBar(null, r.jev_spend)}`;
      const btn = $("jev-run");
      if (btn && ok) btn.addEventListener("click", async () => {
        btn.disabled = true; btn.textContent = "Jev 思考中…";
        try {
          const res = await fetch(`/api/jev?q=${encodeURIComponent(r.symbol)}`, { method: "POST" });
          const data = await res.json();
          if (data.error) { el.innerHTML = `<div class="empty">${esc(data.error)}</div>`; return; }
          renderJev(data, r);
        } catch (e) { el.innerHTML = `<div class="empty">Jev 调用失败：${esc(e.message)}</div>`; }
      });
      return;
    }
    const rows = record.threshold_checks.map((c) => {
      const a = record.answers[c.id];
      return `<tr><td>${esc(JEV_LABELS[c.id] || c.id)}</td><td class="num">${num(c.score, 2)}</td><td>${esc(c.rule)}</td><td class="${c.passed ? "pass" : "fail"}">${c.passed ? "✓" : "✕"}</td><td>${esc(a.reason)}</td></tr>`;
    }).join("");
    el.innerHTML = `<div class="judgment ${esc(record.judgment)}">${esc({ support: "Jev 支持", neutral: "Jev 中性", veto: "Jev 否决" }[record.judgment])} · ${esc(record.combined)}</div>
      <div style="font-size:12.5px;margin-bottom:8px">${esc(record.summary)}</div>
      <table><thead><tr><th>问题</th><th class="num">分数</th><th>阈值</th><th></th><th>理由</th></tr></thead><tbody>${rows}</tbody></table>
      ${record.key_risks.length ? `<ul class="flags">${record.key_risks.map((k) => `<li class="n1">${esc(k)}</li>`).join("")}</ul>` : ""}
      <div class="note">${esc(record.provider)} · ${esc(record.model)} · 资料包 ${esc(record.packet_sha256.slice(0, 12))} · ${record.cached ? "存档结果" : "新调用"} · 仅供研究参考，不改变任何交易或证据</div>
      ${costBar(record, record.jev_spend || r.jev_spend)}`;
  }

  async function load(query) {
    if (!query) return;
    clearTimeout(intradayTimer);
    current = null;
    $("query").value = query;
    history.replaceState(null, "", `#${encodeURIComponent(query)}`);
    $("stock").innerHTML = '<div class="empty">分析中…</div>';
    $("research").hidden = true;
    try {
      const stock = await getJSON(`/api/stock?q=${encodeURIComponent(query)}`);
      renderStock(stock);
      if (!stock.error) loadResearch(stock.symbol);
    }
    catch (e) { $("stock").innerHTML = `<div class="empty">请求失败：${esc(e.message)}</div>`; }
  }

  $("search-form").addEventListener("submit", (e) => { e.preventDefault(); const q = $("query").value.split(" ")[0]; load(q); });

  (async () => {
    try {
      const [universe, picks] = await Promise.all([getJSON("/api/universe"), getJSON("/api/picks")]);
      $("universe").innerHTML = universe.map((u) => `<option value="${esc(u.symbol)} ${esc(u.name)}${u.csi300 ? " · 沪深300" : ""}"></option>`).join("");
      renderPicks(picks);
      const initial = decodeURIComponent(location.hash.slice(1)) || (picks.pool && picks.pool.pool[0] && picks.pool.pool[0].symbol) || (picks.candidates[0] && picks.candidates[0].symbol);
      if (initial) load(initial);
    } catch (e) {
      $("meta").textContent = `数据载入失败：${e.message}`;
    }
  })();
})();
</script>
</body>
</html>
