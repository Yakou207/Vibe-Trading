[project]
name = "fintech-quant-agent"
version = "0.1.0"
description = "A research-first A-share quantitative trading system with RL buy/sell/hold strategy support."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fintech-quant-dashboard = "fintech_quant.reports.dashboard:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
data = [
    "akshare",
    "finnhub-python",
    "yfinance",
]
research = [
    "numpy",
    "pandas",
    "matplotlib",
]
dashboard = [
    "pandas",
    "plotly",
    "streamlit",
]
rl = [
    "gymnasium",
    "torch",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
